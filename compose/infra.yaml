# Core Infrastructure Services
# All third-party daemons and their init containers
# These services have NO profile and start by default

services:
  traefik:
    image: traefik:v3.5
    restart: always
    ports:
      - "80:80"
      - "8888:8080" # Dashboard (direct access for development)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../infra/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ../infra/traefik/dynamic/middlewares.dev.yml:/etc/traefik/dynamic/middlewares.yml:ro
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/kratos/init-kratos-db.sh:/docker-entrypoint-initdb.d/init-kratos-db.sh
    env_file: ../.env
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nexus_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file: ../.env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault:
    image: hashicorp/vault:1.21.0
    restart: always
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    command:
      - server
      - -dev
      - -dev-root-token-id=root
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      - MH_AUTH_FILE=
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mail.nexus.local`)"
      - "traefik.http.routers.mailhog.entrypoints=web"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"
      - "traefik.http.routers.mailhog.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: always
    ports:
      - "7233:7233"
    env_file: ../.env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kratos-secrets:
    image: hashicorp/vault:1.21.0
    volumes:
      - ../infra/kratos:/scripts:ro
      - kratos_secrets:/secrets
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    command: ["/scripts/load-secrets-from-vault.sh", "/secrets/kratos.env"]
    depends_on:
      vault:
        condition: service_healthy

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    volumes:
      - ../infra/kratos:/etc/config/kratos:ro
      - kratos_secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /secrets/kratos.env ]; then
          set -a
          . /secrets/kratos.env
          set +a
        fi
        kratos migrate sql -c /etc/config/kratos/kratos.dev.yml -e --yes
    depends_on:
      postgres:
        condition: service_healthy
      kratos-secrets:
        condition: service_completed_successfully

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    ports:
      - "4433:4433"
      - "4434:4434" # Admin API
    volumes:
      - ../infra/kratos:/etc/config/kratos:ro
      - kratos_secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /secrets/kratos.env ]; then
          set -a
          . /secrets/kratos.env
          set +a
        fi
        kratos serve -c /etc/config/kratos/kratos.dev.yml --watch-courier --dev
    labels:
      - "traefik.enable=true"
      # Kratos public API (self-service endpoints)
      - "traefik.http.routers.kratos-api.rule=Host(`auth.nexus.local`) && PathPrefix(`/self-service`)"
      - "traefik.http.routers.kratos-api.entrypoints=web"
      - "traefik.http.services.kratos-api.loadbalancer.server.port=4433"
      - "traefik.http.routers.kratos-api.priority=200"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      kratos-secrets:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4433/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keto-migrate:
    image: oryd/keto:v0.14.0
    volumes:
      - ../infra/keto:/etc/config/keto:ro
    env_file: ../.env
    environment:
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/keto_db?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate up --config /etc/config/keto/keto.dev.yml -y
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v0.14.0
    restart: always
    ports:
      - "4466:4466"
      - "4467:4467"
    volumes:
      - ../infra/keto:/etc/config/keto:ro
    env_file: ../.env
    environment:
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/keto_db?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve --config /etc/config/keto/keto.dev.yml
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4467/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    restart: always
    ports:
      - "4455:4455"
      - "4456:4456" # Decision API for Traefik ForwardAuth
    volumes:
      - ../infra/oathkeeper:/etc/config/oathkeeper:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Load Redis password from Vault
        export REDIS_PASSWORD=$$(wget -qO- \
          --header "X-Vault-Token: $${VAULT_TOKEN}" \
          "$${VAULT_ADDR}/v1/kv/data/shared/redis" | \
          grep -o '"current":"[^"]*"' | cut -d'"' -f4)

        # Export cache configuration via environment variables
        # Uses Redis for distributed caching of auth/authz decisions
        export CACHE_TYPE=redis
        export CACHE_REDIS_URL="redis://:$${REDIS_PASSWORD}@redis:6379/1"
        export CACHE_REDIS_MAX_RETRIES=3
        export CACHE_REDIS_MIN_IDLE_CONNS=5
        export CACHE_REDIS_POOL_SIZE=10
        export CACHE_REDIS_DIAL_TIMEOUT=5s
        export CACHE_REDIS_READ_TIMEOUT=3s
        export CACHE_REDIS_WRITE_TIMEOUT=3s
        export CACHE_TTL=60s

        # Start Oathkeeper with loaded secrets
        oathkeeper serve --config /etc/config/oathkeeper/oathkeeper.dev.yml
    env_file: ../.env
    environment:
      - LOG_LEVEL=debug
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    depends_on:
      kratos:
        condition: service_started
      keto:
        condition: service_started
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4456/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # === OBSERVABILITY STACK ===
  # Logs, Traces, Metrics, and Dashboards

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    ports:
      - "8086:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
      - DOZZLE_TAILSIZE=300
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.nexus.local`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.http.routers.dozzle.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: always
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=10000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.nexus.local`)"
      - "traefik.http.routers.jaeger.entrypoints=web"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
      - "traefik.http.routers.jaeger.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:14269"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../infra/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.nexus.local`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=http://grafana.nexus.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.nexus.local`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=oathkeeper-auth@file"
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: always
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--storage_duration=1m"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: always
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/nexus_db?sslmode=disable
    env_file: ../.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: always
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    env_file: ../.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  kratos_secrets:
  prometheus_data:
  grafana_data:
