# Core Infrastructure Services
# All third-party daemons and their init containers
# These services have NO profile and start by default

services:
  traefik:
    image: traefik:v3.5
    restart: always
    ports:
      - "80:80"
      - "8888:8080" # Dashboard (direct access for development)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../infra/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ../infra/traefik/dynamic/middlewares.dev.yml:/etc/traefik/dynamic/middlewares.yml:ro
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infra/kratos/init-kratos-db.sh:/docker-entrypoint-initdb.d/init-kratos-db.sh
    env_file: ../.env
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nexus_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nexus_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file: ../.env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault:
    image: hashicorp/vault:1.21.0
    restart: always
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    command:
      - server
      - -dev
      - -dev-root-token-id=root
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      - MH_AUTH_FILE=
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mail.nexus.local`)"
      - "traefik.http.routers.mailhog.entrypoints=web"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"
      - "traefik.http.routers.mailhog.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: always
    ports:
      - "7233:7233"
    env_file: ../.env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - TEMPORAL_TRACING_PROVIDER=otel
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
    depends_on:
      postgres:
        condition: service_healthy
      alloy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kratos-secrets:
    image: hashicorp/vault:1.21.0
    volumes:
      - ../infra/kratos:/scripts:ro
      - kratos_secrets:/secrets
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    command: ["/scripts/load-secrets-from-vault.sh", "/secrets/kratos.env"]
    depends_on:
      vault:
        condition: service_healthy

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    volumes:
      - ../infra/kratos:/etc/config/kratos:ro
      - kratos_secrets:/secrets
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /secrets/kratos.env ]; then
          set -a
          . /secrets/kratos.env
          set +a
        fi
        kratos migrate sql -c /etc/config/kratos/kratos.dev.yml -e --yes
    depends_on:
      postgres:
        condition: service_healthy
      kratos-secrets:
        condition: service_completed_successfully

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    ports:
      - "4433:4433"
      - "4434:4434" # Admin API
    volumes:
      - ../infra/kratos:/etc/config/kratos:ro
      - kratos_secrets:/secrets
    environment:
      - TRACING_PROVIDER=jaeger
      - TRACING_PROVIDERS_JAEGER_SAMPLING_SERVER_URL=http://alloy:5778/sampling
      - TRACING_PROVIDERS_JAEGER_LOCAL_AGENT_ADDRESS=alloy:6831
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -f /secrets/kratos.env ]; then
          set -a
          . /secrets/kratos.env
          set +a
        fi
        kratos serve -c /etc/config/kratos/kratos.dev.yml --watch-courier --dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kratos-api.rule=Host(`auth.nexus.local`) && PathPrefix(`/self-service`)"
      - "traefik.http.routers.kratos-api.entrypoints=web"
      - "traefik.http.routers.kratos-api.service=kratos-api"
      - "traefik.http.services.kratos-api.loadbalancer.server.port=4433"
      - "traefik.http.routers.kratos-api.priority=200"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      kratos-secrets:
        condition: service_completed_successfully
      alloy:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4433/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keto-migrate:
    image: oryd/keto:v0.14.0
    volumes:
      - ../infra/keto:/etc/config/keto:ro
    env_file: ../.env
    environment:
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/keto_db?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate up --config /etc/config/keto/keto.dev.yml -y
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v0.14.0
    restart: always
    ports:
      - "4466:4466"
      - "4467:4467"
    volumes:
      - ../infra/keto:/etc/config/keto:ro
    env_file: ../.env
    environment:
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/keto_db?sslmode=disable&max_conns=20&max_idle_conns=4
      - TRACING_PROVIDER=jaeger
      - TRACING_PROVIDERS_JAEGER_SAMPLING_SERVER_URL=http://alloy:5778/sampling
      - TRACING_PROVIDERS_JAEGER_LOCAL_AGENT_ADDRESS=alloy:6831
    command: serve --config /etc/config/keto/keto.dev.yml
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
      alloy:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4467/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    restart: always
    ports:
      - "4455:4455"
      - "4456:4456" # Decision API for Traefik ForwardAuth
    volumes:
      - ../infra/oathkeeper:/etc/config/oathkeeper:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Load Redis password from Vault
        export REDIS_PASSWORD=$$(wget -qO- \
          --header "X-Vault-Token: $${VAULT_TOKEN}" \
          "$${VAULT_ADDR}/v1/kv/data/shared/redis" | \
          grep -o '"current":"[^"]*"' | cut -d'"' -f4)

        # Export cache configuration via environment variables
        # Uses Redis for distributed caching of auth/authz decisions
        export CACHE_TYPE=redis
        export CACHE_REDIS_URL="redis://:$${REDIS_PASSWORD}@redis:6379/1"
        export CACHE_REDIS_MAX_RETRIES=3
        export CACHE_REDIS_MIN_IDLE_CONNS=5
        export CACHE_REDIS_POOL_SIZE=10
        export CACHE_REDIS_DIAL_TIMEOUT=5s
        export CACHE_REDIS_READ_TIMEOUT=3s
        export CACHE_REDIS_WRITE_TIMEOUT=3s
        export CACHE_TTL=60s

        # Start Oathkeeper with loaded secrets
        oathkeeper serve --config /etc/config/oathkeeper/oathkeeper.dev.yml
    env_file: ../.env
    environment:
      - LOG_LEVEL=debug
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - TRACING_PROVIDER=jaeger
      - TRACING_PROVIDERS_JAEGER_SAMPLING_SERVER_URL=http://alloy:5778/sampling
      - TRACING_PROVIDERS_JAEGER_LOCAL_AGENT_ADDRESS=alloy:6831
    depends_on:
      kratos:
        condition: service_started
      keto:
        condition: service_started
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
      alloy:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4456/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # === OBSERVABILITY STACK ===
  # Logs, Traces, Metrics, and Dashboards

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    ports:
      - "8086:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_LEVEL=info
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.nexus.local`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.http.routers.dozzle.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  tempo:
    image: grafana/tempo:latest
    restart: always
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200" # Tempo HTTP API (for Grafana datasource only)
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  alloy:
    image: grafana/alloy:latest
    restart: always
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "/etc/alloy/config.alloy",
      ]
    volumes:
      - ../infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # For service discovery
    ports:
      - "12345:12345" # Alloy HTTP API
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "6831:6831/udp" # Jaeger thrift compact (legacy)
      - "6832:6832/udp" # Jaeger thrift binary (legacy)
      - "14250:14250" # Jaeger gRPC (legacy)
      - "14268:14268" # Jaeger thrift HTTP (legacy)
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f alloy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      tempo:
        condition: service_healthy
      mimir:
        condition: service_healthy

  mimir:
    image: grafana/mimir:latest
    restart: always
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ../infra/mimir/mimir.yaml:/etc/mimir.yaml:ro
      - mimir_data:/data
    ports:
      - "9009:9009" # Mimir HTTP (for Grafana datasource)
      - "9095:9095" # gRPC (internal)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mimir.rule=Host(`mimir.nexus.local`)"
      - "traefik.http.routers.mimir.entrypoints=web"
      - "traefik.http.services.mimir.loadbalancer.server.port=9009"
      - "traefik.http.routers.mimir.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "/bin/mimir", "-version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SERVER_ROOT_URL=http://grafana.nexus.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.nexus.local`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=oathkeeper-auth@file"
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  kratos_secrets:
  tempo_data:
  mimir_data:
  grafana_data:
