# Kratos Configuration - SHARED (Dev + Prod)
# Environment-specific values configured via env vars in docker-compose files

version: v1.3.0

dsn: ${DSN}

serve:
  public:
    base_url: https://auth.${DOMAIN} # Dev: local domain; Prod: will use actual domain
    cors:
      enabled: true
      allowed_origins:
        - https://${DOMAIN}
        - https://api.${DOMAIN}
        - https://auth.${DOMAIN}
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: https://kratos.service.local:4434
    tls:
      key:
        path: /secrets/cert.key
      cert:
        path: /secrets/cert.crt

selfservice:
  default_browser_return_url: https://${DOMAIN}/
  allowed_return_urls:
    - https://${DOMAIN}
    - https://api.${DOMAIN}

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: true
        min_password_length: 8
    totp:
      config:
        issuer: Nexus
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: ${GOOGLE_CLIENT_ID}
            client_secret: ${GOOGLE_CLIENT_SECRET}
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - email
              - profile
            requested_claims:
              id_token:
                email:
                  essential: true
                email_verified:
                  essential: true
                given_name:
                  essential: true
                family_name: null
                hd: null

  flows:
    error:
      ui_url: https://auth.${DOMAIN}/error

    settings:
      ui_url: https://auth.${DOMAIN}/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: https://auth.${DOMAIN}/recovery
      use: code

    verification:
      enabled: true
      ui_url: https://auth.${DOMAIN}/verification
      use: code
      after:
        default_browser_return_url: https://${DOMAIN}/

    logout:
      after:
        default_browser_return_url: https://auth.${DOMAIN}/login

    login:
      ui_url: https://auth.${DOMAIN}/login
      lifespan: 10m
      after:
        default_browser_return_url: https://${DOMAIN}/
        hooks:
          - hook: web_hook
            config:
              url: http://oathkeeper:4455/api/v1/internal/webhooks/kratos/login
              method: POST
              body: file:///etc/config/kratos/webhook.jsonnet
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: file:///secrets/webhook.key
                  in: header
        oidc:
          hooks:
            - hook: web_hook
              config:
                url: http://oathkeeper:4455/api/v1/internal/webhooks/kratos/login
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: file:///secrets/webhook.key
                    in: header

    registration:
      lifespan: 10m
      ui_url: https://auth.${DOMAIN}/registration
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://oathkeeper:4455/api/v1/internal/webhooks/kratos/registration
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: file:///secrets/webhook.key
                    in: header

log:
  level: ${LOG_LEVEL:-info}
  format: ${LOG_FORMAT:-json}
  leak_sensitive_values: ${LOG_LEAK_SENSITIVE:-false}

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: ${SMTP_CONNECTION_URI}
