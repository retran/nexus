# Kratos Configuration - SHARED (Dev + Prod)
# Environment-specific values configured via env vars in docker-compose files

version: v1.3.0

dsn: ${DSN}

serve:
  public:
    base_url: http://localhost:4433 # Dev: local access; Prod: will use actual domain via env
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:3000
        - http://localhost:8001
        - http://localhost:8002
        - http://localhost:8003
        - http://localhost:4433
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://localhost:4434 # Dev: no TLS for admin API

selfservice:
  default_browser_return_url: http://localhost:3000/
  allowed_return_urls:
    - http://localhost:3000
    - http://localhost:8001
    - http://localhost:8002
    - http://localhost:8003

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: true
        min_password_length: 8
    totp:
      config:
        issuer: Nexus
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: ${GOOGLE_CLIENT_ID}
            client_secret: ${GOOGLE_CLIENT_SECRET}
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - email
              - profile
            requested_claims:
              id_token:
                email:
                  essential: true
                email_verified:
                  essential: true
                given_name:
                  essential: true
                family_name: null
                hd: null

  flows:
    error:
      ui_url: http://localhost:4433/error

    settings:
      ui_url: http://localhost:4433/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://localhost:4433/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:4433/verification
      use: code
      after:
        default_browser_return_url: http://localhost:3000/

    logout:
      after:
        default_browser_return_url: http://localhost:4433/login

    login:
      ui_url: http://localhost:4433/login
      lifespan: 10m
      after:
        default_browser_return_url: http://localhost:3000/
        hooks:
          - hook: web_hook
            config:
              url: http://system:8083/webhooks/kratos/login
              method: POST
              body: file:///etc/config/kratos/webhook.jsonnet
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: ${KRATOS_WEBHOOK_SECRET}
                  in: header
        oidc:
          hooks:
            - hook: web_hook
              config:
                url: http://system:8083/webhooks/kratos/login
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: ${KRATOS_WEBHOOK_SECRET}
                    in: header

    registration:
      lifespan: 10m
      ui_url: http://localhost:4433/registration
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://system:8083/webhooks/kratos/registration
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: ${KRATOS_WEBHOOK_SECRET}
                    in: header

log:
  level: debug
  format: text
  leak_sensitive_values: true

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailhog:1025/?skip_ssl_verify=true
