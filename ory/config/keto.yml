# Ory Keto Configuration - DEVELOPMENT ENVIRONMENT
# Production configuration will be in separate file with proper secrets management

version: v0.14.0

dsn: postgres://admin:SUPER_SECRET_PASSWORD@postgres:5432/keto_db?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  read:
    host: 0.0.0.0
    port: 4466
    cors:
      enabled: true
      allowed_origins:
        - https://${DOMAIN}
        - https://api.${DOMAIN}
        - http://oathkeeper:4455
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type
      allow_credentials: true
  write:
    host: 0.0.0.0
    port: 4467
    cors:
      enabled: true
      allowed_origins:
        - https://${DOMAIN}
        - https://api.${DOMAIN}
        - http://oathkeeper:4455
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type
      allow_credentials: true

namespaces:
  location: file:///etc/config/keto/namespaces.ts

log:
  level: debug
  format: json
