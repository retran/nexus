version: "3"

vars:
  KRATOS_VERSION: "v1.3.1"
  KETO_VERSION: "v0.14.0"
  OATHKEEPER_VERSION: "v0.40.9"
  # Colors
  GREEN: \033[0;32m
  YELLOW: \033[0;33m
  BLUE: \033[0;34m
  RED: \033[0;31m
  NC: \033[0m

tasks:
  # === Kratos (Identity Management) ===

  kratos:migrate:
    desc: "Run Kratos database migrations"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running Kratos database migrations...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml run --rm kratos-migrate
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Kratos migrations complete\n"

  kratos:identities:list:
    desc: "List all identities"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Listing identities...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec kratos \
          kratos identities list --endpoint http://localhost:4434

  kratos:identities:get:
    desc: "Get identity by ID (usage: task ory:kratos:identities:get ID=<uuid>)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Getting identity {{.ID}}...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec kratos \
          kratos identities get {{.ID}} --endpoint http://localhost:4434
    requires:
      vars:
        - ID

  kratos:identities:create:
    desc: "Create identity from JSON file (usage: task ory:kratos:identities:create FILE=identity.json)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Creating identity from {{.FILE}}...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec -T kratos \
          kratos identities create --endpoint http://localhost:4434 < {{.FILE}}
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Identity created\n"
    requires:
      vars:
        - FILE

  kratos:identities:delete:
    desc: "Delete identity by ID (usage: task ory:kratos:identities:delete ID=<uuid>)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    prompt: "This will permanently delete the identity. Continue?"
    cmds:
      - |
        printf "{{.RED}}[WARN]{{.NC}} Deleting identity {{.ID}}...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec kratos \
          kratos identities delete {{.ID}} --endpoint http://localhost:4434
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Identity deleted\n"
    requires:
      vars:
        - ID

  kratos:validate:
    desc: "Validate Kratos configuration"
    silent: true
    dir: "{{.ROOT_DIR}}/ory"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Validating Kratos configuration...\n"
      - |
        docker run --rm -v $(pwd)/config:/config \
          oryd/kratos:{{.KRATOS_VERSION}} \
          validate /config/kratos.yml
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Kratos configuration is valid\n"

  # === Keto (Permissions/ACL) ===

  keto:migrate:
    desc: "Run Keto database migrations"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running Keto database migrations...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml run --rm keto-migrate
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Keto migrations complete\n"

  keto:relationtuple:create:
    desc: "Create relation tuple (usage: task ory:keto:relationtuple:create -- args)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Creating relation tuple...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec keto \
          keto relation-tuple create {{.CLI_ARGS}} --endpoint http://localhost:4467
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Relation tuple created\n"

  keto:relationtuple:delete:
    desc: "Delete relation tuple (usage: task ory:keto:relationtuple:delete -- args)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.RED}}[WARN]{{.NC}} Deleting relation tuple...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec keto \
          keto relation-tuple delete {{.CLI_ARGS}} --endpoint http://localhost:4467
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Relation tuple deleted\n"

  keto:relationtuple:list:
    desc: "List relation tuples (usage: task ory:keto:relationtuple:list -- namespace)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Listing relation tuples...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec keto \
          keto relation-tuple get {{.CLI_ARGS}} --endpoint http://localhost:4467

  keto:check:
    desc: "Check permission (usage: task ory:keto:check -- args)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Checking permission...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec keto \
          keto check {{.CLI_ARGS}} --endpoint http://localhost:4466

  keto:expand:
    desc: "Expand subject set (usage: task ory:keto:expand -- args)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Expanding subject set...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec keto \
          keto expand {{.CLI_ARGS}} --endpoint http://localhost:4466

  keto:validate:
    desc: "Validate Keto configuration"
    silent: true
    dir: "{{.ROOT_DIR}}/ory"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Validating Keto configuration...\n"
      - |
        docker run --rm -v $(pwd)/config:/config \
          oryd/keto:{{.KETO_VERSION}} \
          validate /config/keto.yml
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Keto configuration is valid\n"

  keto:validate:namespaces:
    desc: "Validate Keto namespaces configuration"
    silent: true
    dir: "{{.ROOT_DIR}}/ory"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Validating Keto namespaces...\n"
      - |
        docker run --rm -v $(pwd)/config:/config \
          oryd/keto:{{.KETO_VERSION}} \
          namespace validate /config/namespaces.ts
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Keto namespaces are valid\n"

  # === Oathkeeper (API Gateway/Proxy) ===

  oathkeeper:rules:list:
    desc: "List Oathkeeper access rules"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Listing Oathkeeper access rules...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec oathkeeper \
          oathkeeper rules list --endpoint http://localhost:4456

  oathkeeper:rules:get:
    desc: "Get Oathkeeper rule by ID (usage: task ory:oathkeeper:rules:get ID=<rule-id>)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Getting Oathkeeper rule {{.ID}}...\n"
      - |
        docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml exec oathkeeper \
          oathkeeper rules get {{.ID}} --endpoint http://localhost:4456
    requires:
      vars:
        - ID

  oathkeeper:validate:
    desc: "Validate Oathkeeper configuration"
    silent: true
    dir: "{{.ROOT_DIR}}/ory"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Validating Oathkeeper configuration...\n"
      - |
        docker run --rm -v $(pwd)/config:/config \
          oryd/oathkeeper:{{.OATHKEEPER_VERSION}} \
          validate /config/oathkeeper.yml
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Oathkeeper configuration is valid\n"

  oathkeeper:rules:validate:
    desc: "Validate Oathkeeper access rules"
    silent: true
    dir: "{{.ROOT_DIR}}/ory"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Validating Oathkeeper access rules...\n"
      - |
        docker run --rm -v $(pwd)/config:/config \
          oryd/oathkeeper:{{.OATHKEEPER_VERSION}} \
          rules --config /config/oathkeeper.yml validate /config/access-rules.yml
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Oathkeeper access rules are valid\n"

  # === Development Helpers ===

  seed:admin:
    desc: "Create admin user for development (idempotent)"
    silent: true
    dir: "{{.ROOT_DIR}}/ory"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Creating admin user...\n"
      - |
        # Check if admin identity already exists
        EXISTING_ID=$(docker compose -f ../docker-compose.base.yaml -f ../docker-compose.dev.yaml exec -T kratos \
          kratos identities list \
          --endpoint http://localhost:4434 \
          --format json 2>/dev/null | jq -r '.[] | select(.traits.email == "admin@nexus.local") | .id' || echo "")

        if [ -n "$EXISTING_ID" ]; then
          printf "{{.GREEN}}[OK]{{.NC}} Admin user already exists with ID: $EXISTING_ID\n"
          printf "{{.BLUE}}[INFO]{{.NC}} Email: admin@nexus.local\n"
          ADMIN_ID="$EXISTING_ID"
        else
          printf "{{.BLUE}}[INFO]{{.NC}} Creating admin identity...\n"
          ADMIN_ID=$(docker compose -f ../docker-compose.base.yaml -f ../docker-compose.dev.yaml exec -T kratos \
            kratos identities create \
            --endpoint http://localhost:4434 \
            --format json < seeds/admin-identity.json | jq -r '.id')
          printf "{{.GREEN}}[OK]{{.NC}} Admin user created with ID: $ADMIN_ID\n"
          printf "{{.BLUE}}[INFO]{{.NC}} Email: admin@nexus.local\n"
          printf "{{.BLUE}}[INFO]{{.NC}} Password: admin123\n"
        fi

        # Grant admin role (idempotent - keto allows duplicate creates)
        docker compose -f ../docker-compose.base.yaml -f ../docker-compose.dev.yaml exec keto \
          keto relation-tuple create \
          --endpoint http://localhost:4467 \
          --namespace Role \
          --object admin \
          --relation members \
          --subject-id "$ADMIN_ID" 2>/dev/null || printf "{{.BLUE}}[INFO]{{.NC}} Role already assigned\n"

        printf "{{.GREEN}}[OK]{{.NC}} Admin setup complete\n"

  seed:test-users:
    desc: "Create test users for development (idempotent)"
    silent: true
    dir: "{{.ROOT_DIR}}/ory"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Creating test users...\n"
      - |
        for file in seeds/test-*.json; do
          EMAIL=$(jq -r '.traits.email' "$file")
          FIRST_NAME=$(jq -r '.traits.name.first' "$file")
          LAST_NAME=$(jq -r '.traits.name.last' "$file")
          FULL_NAME="$FIRST_NAME $LAST_NAME"

          # Check if user already exists
          EXISTING_ID=$(docker compose -f ../docker-compose.base.yaml -f ../docker-compose.dev.yaml exec -T kratos \
            kratos identities list \
            --endpoint http://localhost:4434 \
            --format json 2>/dev/null | jq -r --arg email "$EMAIL" '.[] | select(.traits.email == $email) | .id' || echo "")

          if [ -n "$EXISTING_ID" ]; then
            printf "{{.GREEN}}[OK]{{.NC}} User $FULL_NAME ($EMAIL) already exists\n"
          else
            printf "{{.BLUE}}[INFO]{{.NC}} Creating user $FULL_NAME ($EMAIL) from $file...\n"
            docker compose -f ../docker-compose.base.yaml -f ../docker-compose.dev.yaml exec -T kratos \
              kratos identities create \
              --endpoint http://localhost:4434 < "$file" >/dev/null
            printf "{{.GREEN}}[OK]{{.NC}} User $FULL_NAME ($EMAIL) created\n"
          fi
        done
        printf "{{.GREEN}}[OK]{{.NC}} All test users processed\n"

  # === Bootstrap ===

  bootstrap:dev:
    desc: "Bootstrap Ory stack for development (migrations + seeds)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Bootstrapping Ory stack for development...\n"
      - docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml up -d kratos keto oathkeeper
      - sleep 5
      - task: kratos:migrate
      - task: keto:migrate
      - task: seed:admin
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Ory bootstrap complete\n"

  # === Logs ===

  logs:
    desc: "View all Ory logs (use CLI_ARGS for specific service: -- kratos)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml logs -f {{.CLI_ARGS}} kratos keto oathkeeper

  # === Validation ===

  validate:
    desc: "Validate all Ory configurations"
    silent: true
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Validating all Ory configurations...\n"
      - task: kratos:validate
      - task: keto:validate
      - task: keto:validate:namespaces
      - task: oathkeeper:validate
      - task: oathkeeper:rules:validate
      - |
        printf "{{.GREEN}}[OK]{{.NC}} All Ory configurations are valid\n"

  # === Destroy ===

  destroy:
    desc: "Destroy all Ory data and containers (WARNING: irreversible)"
    silent: true
    dir: "{{.ROOT_DIR}}"
    prompt: "This will DESTROY all Ory containers, volumes, and data. Continue?"
    cmds:
      - |
        printf "{{.RED}}[WARN]{{.NC}} Destroying Ory stack...\n"
      - docker compose -f docker-compose.base.yaml -f docker-compose.dev.yaml down kratos keto oathkeeper
      - docker volume rm nexus_kratos_data 2>/dev/null || true
      - docker volume rm nexus_keto_data 2>/dev/null || true
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Ory stack destroyed\n"
