# Kratos Configuration - DEVELOPMENT ENVIRONMENT
# Production configuration will be in separate file with proper secrets management

version: v1.3.0

dsn: postgres://kratos:kratos@postgres:5432/kratos_db?sslmode=disable&max_conns=20&max_idle_conns=4

serve:
  public:
    base_url: http://auth.nexus.local # Dev: local domain; Prod: will use actual domain
    cors:
      enabled: true
      allowed_origins:
        - http://nexus.local
        - http://api.nexus.local
        - http://auth.nexus.local
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: https://kratos.service.local:4434
    tls:
      key:
        path: /secrets/cert.key
      cert:
        path: /secrets/cert.crt

selfservice:
  default_browser_return_url: http://nexus.local/
  allowed_return_urls:
    - http://nexus.local
    - http://api.nexus.local
    - http://vault:8200
    - http://localhost:8200
    - http://localhost:8200/ui/vault/auth/oidc/oidc/callback

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: true
        min_password_length: 8
    totp:
      config:
        issuer: Nexus
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: to-be-configured
            client_secret: to-be-configured
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - email
              - profile
            requested_claims:
              id_token:
                email:
                  essential: true
                email_verified:
                  essential: true
                given_name:
                  essential: true
                family_name: null
                hd: null

  flows:
    error:
      ui_url: http://auth.nexus.local/error

    settings:
      ui_url: http://auth.nexus.local/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://auth.nexus.local/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://auth.nexus.local/verification
      use: code
      after:
        default_browser_return_url: http://nexus.local/

    logout:
      after:
        default_browser_return_url: http://auth.nexus.local/login

    login:
      ui_url: http://auth.nexus.local/login
      lifespan: 10m
      after:
        default_browser_return_url: http://nexus.local/
        hooks:
          - hook: web_hook
            config:
              url: http://oathkeeper:4455/api/v1/internal/webhooks/kratos/login
              method: POST
              body: file:///etc/config/kratos/webhook.jsonnet
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: file:///secrets/webhook.key
                  in: header
        oidc:
          hooks:
            - hook: web_hook
              config:
                url: http://oathkeeper:4455/api/v1/internal/webhooks/kratos/login
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: file:///secrets/webhook.key
                    in: header

    registration:
      lifespan: 10m
      ui_url: http://auth.nexus.local/registration
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: http://oathkeeper:4455/api/v1/internal/webhooks/kratos/registration
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: file:///secrets/webhook.key
                    in: header

log:
  level: debug # Dev: debug; Prod: info or warn
  format: text
  leak_sensitive_values: true # Dev only! Must be false in production

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://test:test@mailslurper:1025/?skip_ssl_verify=true # Dev: mailslurper; Prod: real SMTP
