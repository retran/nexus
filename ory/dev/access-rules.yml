# Oathkeeper Access Rules - DEVELOPMENT ENVIRONMENT
# Production rules will use actual domains with HTTPS

- id: "public:auth"
  upstream:
    preserve_host: true
    url: "http://kratos-selfservice-ui:3000"
  match:
    url: "http://auth.nexus.local/<**>"
    methods:
      - GET
      - POST
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: "protected:api:admin"
  upstream:
    preserve_host: false
    url: "https://gateway.service.local:8080"
    strip_path: /.ory/kratos/public
  match:
    url: "http://<{api,127.0.0.1,localhost}{,:4455}>/api/admin/<**>"
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote
    config:
      remote: "http://keto:4466/relation-tuples/check"
      payload: |
        {
          "namespace": "Role",
          "object": "admin",
          "relation": "members",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: id_token
    - handler: header
  errors:
    - handler: redirect
      config:
        to: http://auth.nexus.local/login

