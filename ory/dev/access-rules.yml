# Kratos webhook proxy - routes webhooks via Oathkeeper with mTLS to internal-api
- id: "webhook:kratos"
  upstream:
    preserve_host: false
    url: "https://internal-api.service.local:8083"
  match:
    url: "http://<{oathkeeper,127.0.0.1,localhost}{,:4455}>/api/v1/internal/webhooks/kratos/<**>"
    methods:
      - POST
  authenticators:
    - handler: noop # Kratos already authenticated with X-Webhook-Secret
  authorizer:
    handler: allow
  mutators:
    - handler: noop # Pass through all headers from Kratos

