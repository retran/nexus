# Oathkeeper Configuration - DEVELOPMENT ENVIRONMENT
# Production configuration will be in separate file with proper TLS and domains

version: v0.40.6

log:
  level: debug # Dev: debug; Prod: info or warn
  format: json

serve:
  proxy:
    cors:
      enabled: true
      allowed_origins:
        - http://nexus.local
        - http://api.nexus.local
        - http://graphql.nexus.local
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
        - HEAD
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
      debug: true

errors:
  fallback:
    - json
  handlers:
    redirect:
      enabled: true
      config:
        to: http://auth.nexus.local/login
        when:
          - error:
              - unauthorized
              - forbidden
            request:
              header:
                accept:
                  - text/html
    json:
      enabled: true
      config:
        verbose: true

access_rules:
  matching_strategy: glob
  repositories:
    - file:///etc/config/oathkeeper/access-rules.yml

authenticators:
  anonymous:
    enabled: true
    config:
      subject: guest

  cookie_session:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      extra_from: "@this"
      subject_from: "identity.id"
      only:
        - ory_kratos_session

  noop:
    enabled: true

authorizers:
  allow:
    enabled: true

  deny:
    enabled: true

mutators:
  noop:
    enabled: true

  header:
    enabled: true
    config:
      headers:
        X-User: "{{ print .Subject }}"
        X-User-Email: "{{ print .Extra.identity.traits.email }}"
        X-User-Role: "{{ print .Extra.identity.traits.role }}"

  id_token:
    enabled: true
    config:
      issuer_url: http://auth.nexus.local
      jwks_url: file:///etc/config/oathkeeper/id_token.jwks.json
      claims: |
        {
          "session": {{ .Extra | toJson }}
        }
