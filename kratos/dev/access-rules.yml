# Oathkeeper Access Rules - DEVELOPMENT ENVIRONMENT
# Production rules will use actual domains with HTTPS

- id: "public:auth"
  upstream:
    preserve_host: true
    url: "http://kratos-selfservice-ui:3000"
  match:
    url: "http://auth.nexus.local/<**>"
    methods:
      - GET
      - POST
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: "protected:api"
  upstream:
    preserve_host: false
    url: "http://gateway:8080"
    strip_path: /.ory/kratos/public
  match:
    url: "http://<{api,127.0.0.1,localhost}{,:4455}>/api/<**>"
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
    - handler: header
  errors:
    - handler: redirect
      config:
        to: http://auth.nexus.local/login

- id: "protected:graphql"
  upstream:
    preserve_host: false
    url: "http://data-api:8081"
  match:
    url: "http://<{graphql,127.0.0.1,localhost}{,:4455}>/graphql<**>"
    methods:
      - GET
      - POST
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: id_token
    - handler: header
  errors:
    - handler: redirect
      config:
        to: http://auth.nexus.local/login

- id: "protected:ui"
  upstream:
    preserve_host: false
    url: "http://ui:3000"
  match:
    url: "http://<{nexus,127.0.0.1,localhost}{,:4455}>/<**>"
    methods:
      - GET
      - POST
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: noop
  errors:
    - handler: redirect
      config:
        to: http://auth.nexus.local/login
