# Docker Compose - PRODUCTION CONFIGURATION
# This is the production-ready configuration for Mac Mini deployment.
# For local development with hot reload, create docker-compose.override.yaml

services:
  traefik:
    image: traefik:v3.5
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--accesslog=true"
      # ACME/Let's Encrypt configuration (uncomment and configure for production)
      # - "--certificatesresolvers.letsencrypt.acme.email=admin@yourdomain.com"
      # - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    # Traefik dashboard disabled in production for security
    # Access via Tailscale or configure SSO if needed

  postgres:
    image: postgres:18-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ory/scripts/init-kratos-db.sh:/docker-entrypoint-initdb.d/init-kratos-db.sh
    env_file: .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.21.0
    restart: always
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault_data:/vault/data
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_API_ADDR=http://0.0.0.0:8200
    command:
      - vault
      - server
      - -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD", "vault", "status", "-format=json"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault Agent sidecar for temporal
  vault-agent-temporal:
    image: hashicorp/vault:1.21.0
    restart: always
    command: ["agent", "-config=/config/template.hcl"]
    env_file: .env
    environment:
      - PKI_ROLE=temporal-role
      - COMMON_NAME=temporal.service.local
    volumes:
      - ./vault/agent:/config:ro
      - temporal-secrets:/secrets
    entrypoint: >
      sh -c "
      echo \"$$TEMPORAL_ROLE_ID\" > /vault/role-id &&
      echo \"$$TEMPORAL_SECRET_ID\" > /vault/secret-id &&
      exec vault agent -config=/config/template.hcl
      "
    depends_on:
      vault:
        condition: service_started

  temporal:
    image: temporalio/auto-setup:1.29.1
    hostname: temporal.service.local
    restart: always
    volumes:
      - temporal-secrets:/secrets:ro
    env_file: .env
    environment:
      - DB=postgres12 # Use postgres12 or postgres12_pgx for PostgreSQL support
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      # OIDC SSO Configuration for Temporal UI
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_AUTH_PROVIDER_URL=http://auth.nexus.local
      - TEMPORAL_AUTH_CLIENT_ID=${TEMPORAL_OIDC_CLIENT_ID}
      - TEMPORAL_AUTH_CLIENT_SECRET=${TEMPORAL_OIDC_CLIENT_SECRET}
      - TEMPORAL_AUTH_CALLBACK_URL=http://localhost:8088/auth/sso/callback
      - TEMPORAL_AUTH_SCOPES=openid,profile,email
      # mTLS Configuration for gRPC API
      - TEMPORAL_TLS_SERVER_CERT=/secrets/tls.crt
      - TEMPORAL_TLS_SERVER_KEY=/secrets/tls.key
      - TEMPORAL_TLS_SERVER_CA=/secrets/vault-ca.pem
      - TEMPORAL_TLS_REQUIRE_CLIENT_AUTH=true
      - TEMPORAL_TLS_CLIENT_CA_DATA=/secrets/vault-ca.pem
    depends_on:
      vault-agent-temporal:
        condition: service_started
      postgres:
        condition: service_healthy
      kratos:
        condition: service_started

  # Vault Agent sidecar for data
  vault-agent-data:
    image: hashicorp/vault:1.21.0
    restart: always
    command: ["agent", "-config=/config/template.hcl"]
    env_file: .env
    environment:
      - PKI_ROLE=data-role
      - COMMON_NAME=data.service.local
    volumes:
      - ./vault/agent:/config:ro
      - data-secrets:/secrets
    entrypoint: >
      sh -c "
      echo \"$$DATA_API_ROLE_ID\" > /vault/role-id &&
      echo \"$$DATA_API_SECRET_ID\" > /vault/secret-id &&
      exec vault agent -config=/config/template.hcl
      "
    depends_on:
      vault:
        condition: service_started

  data:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.data
    hostname: data.service.local
    restart: always
    expose:
      - "8081"
    env_file: .env
    environment:
      - SERVER_PORT=8081
      - POSTGRES_HOST=postgres
    volumes:
      - data-secrets:/secrets:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.data.entrypoints=websecure"
      - "traefik.http.routers.data.tls.certresolver=letsencrypt"
      - "traefik.http.services.data.loadbalancer.server.port=8081"
    depends_on:
      vault-agent-data:
        condition: service_started
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  # Vault Agent sidecar for worker
  vault-agent-worker:
    image: hashicorp/vault:1.21.0
    restart: always
    command: ["agent", "-config=/config/template.hcl"]
    env_file: .env
    environment:
      - PKI_ROLE=worker-role
      - COMMON_NAME=worker.service.local
    volumes:
      - ./vault/agent:/config:ro
      - worker-secrets:/secrets
    entrypoint: >
      sh -c "
      echo \"$$WORKER_ROLE_ID\" > /vault/role-id &&
      echo \"$$WORKER_SECRET_ID\" > /vault/secret-id &&
      exec vault agent -config=/config/template.hcl
      "
    depends_on:
      vault:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker
    hostname: worker.service.local
    restart: always
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - API_URL=http://data:8081/graphql
    volumes:
      - worker-secrets:/secrets:ro
    depends_on:
      vault-agent-worker:
        condition: service_started
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      data:
        condition: service_started

  # Vault Agent sidecar for system
  vault-agent-system:
    image: hashicorp/vault:1.21.0
    restart: always
    command: ["agent", "-config=/config/template.hcl"]
    env_file: .env
    environment:
      - PKI_ROLE=system-role
      - COMMON_NAME=system.service.local
    volumes:
      - ./vault/agent:/config:ro
      - system-secrets:/secrets
    entrypoint: >
      sh -c "
      echo \"$$INTERNAL_API_ROLE_ID\" > /vault/role-id &&
      echo \"$$INTERNAL_API_SECRET_ID\" > /vault/secret-id &&
      exec vault agent -config=/config/template.hcl
      "
    depends_on:
      vault:
        condition: service_started

  system:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.system
    hostname: system.service.local
    restart: always
    expose:
      - "8083"
    env_file: .env
    environment:
      - PORT=8083
      - GRAPHQL_ENDPOINT=http://data:8081/graphql
      - KRATOS_WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_ROOT_TOKEN}
      - VAULT_SIGNING_KEY=service-jwt-key
      - VAULT_TRANSIT_MOUNT_PATH=transit
      - JWT_ALLOWED_AUDIENCES=system
      - KRATOS_ADMIN_URL=https://kratos.service.local:4434
      - INTERNAL_ALLOWED_ROLES=none,member,admin
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=nexus-task-queue
      - AUDIT_ALLOWED_SUBJECTS=gateway
    volumes:
      - system-secrets:/secrets:ro
    depends_on:
      vault-agent-system:
        condition: service_started
      data:
        condition: service_started
      temporal:
        condition: service_started

  # Vault Agent sidecar for gateway - provisions mTLS certificates
  vault-agent-gateway:
    image: hashicorp/vault:1.21.0
    restart: always
    command: ["agent", "-config=/config/template.hcl"]
    env_file: .env
    environment:
      - PKI_ROLE=gateway-role
      - COMMON_NAME=gateway.service.local
    volumes:
      - ./vault/agent:/config:ro
      - gateway-secrets:/secrets
    # Create temporary files for AppRole credentials from env vars
    entrypoint: >
      sh -c "
      echo \"$$GATEWAY_ROLE_ID\" > /vault/role-id &&
      echo \"$$GATEWAY_SECRET_ID\" > /vault/secret-id &&
      exec vault agent -config=/config/template.hcl
      "
    depends_on:
      vault:
        condition: service_started

  gateway:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.gateway
    hostname: gateway.service.local
    restart: always
    expose:
      - "8080"
    env_file: .env
    environment:
      - GRAPHQL_ENDPOINT=http://data:8081/graphql
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OATHKEEPER_JWT_ISSUER=https://auth.${DOMAIN}
      - OATHKEEPER_JWT_AUDIENCE=gateway
      - OATHKEEPER_JWKS_FILE=/etc/oathkeeper/id_token.jwks.json
    volumes:
      - ./ory/config/id_token.jwks.json:/etc/oathkeeper/id_token.jwks.json:ro
      - gateway-secrets:/secrets:ro
    depends_on:
      vault-agent-gateway:
        condition: service_started
      data:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "80"
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.ui.loadbalancer.server.port=80"
    depends_on:
      - gateway

  # Vault Agent sidecar for kratos
  vault-agent-kratos:
    image: hashicorp/vault:1.21.0
    restart: always
    command: ["agent", "-config=/config/template.hcl"]
    env_file: .env
    environment:
      - PKI_ROLE=kratos-role
      - COMMON_NAME=kratos.service.local
    volumes:
      - ./vault/agent:/config:ro
      - kratos-secrets:/secrets
    entrypoint: >
      sh -c "
      echo \"$$KRATOS_ROLE_ID\" > /vault/role-id &&
      echo \"$$KRATOS_SECRET_ID\" > /vault/secret-id &&
      exec vault agent -config=/config/template.hcl
      "
    depends_on:
      vault:
        condition: service_started

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    restart: on-failure
    env_file: .env
    environment:
      - DSN=${DSN}
    command: -c /etc/confi./ory/kratos.yml migrate sql -e --yes
    volumes:
      - ./ory/config:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.1
    hostname: kratos.service.local
    restart: always
    expose:
      - "4433"
      - "4434"
    env_file: .env
    environment:
      - DSN=${DSN}
      - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET}
      - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET}
      - SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SELFSERVICE_FLOWS_LOGIN_AFTER_OIDC_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=${WEBHOOK_SECRET}
      - SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=${WEBHOOK_SECRET}
    command: serve -c /etc/confi./ory/kratos.yml
    volumes:
      - ./ory/config:/etc/config/kratos:ro
      - kratos-secrets:/secrets:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kratos-public.rule=Host(`auth.${DOMAIN}`) && (PathPrefix(`/self-service`) || PathPrefix(`/schemas`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.kratos-public.entrypoints=websecure"
      - "traefik.http.routers.kratos-public.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kratos-public.priority=100"
      - "traefik.http.services.kratos-public.loadbalancer.server.port=4433"
      - "traefik.http.middlewares.kratos-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.kratos-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.kratos-ratelimit.ratelimit.burst=20"
      - "traefik.http.routers.kratos-public.middlewares=kratos-ratelimit"
    depends_on:
      vault-agent-kratos:
        condition: service_started
      kratos-migrate:
        condition: service_completed_successfully

  kratos-selfservice-ui:
    image: oryd/kratos-selfservice-ui-node:v1.3.1
    restart: always
    expose:
      - "3000"
    env_file: .env
    environment:
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=https://auth.${DOMAIN}
      - SECURITY_MODE=cookie
      - PORT=3000
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_COOKIE_SECRET=${CSRF_COOKIE_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kratos-ui.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.kratos-ui.entrypoints=websecure"
      - "traefik.http.routers.kratos-ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kratos-ui.priority=1"
      - "traefik.http.services.kratos-ui.loadbalancer.server.port=3000"
      # Rate limiting for UI: 300 requests per minute per IP
      - "traefik.http.middlewares.kratos-ui-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.kratos-ui-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.kratos-ui-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.kratos-ui.middlewares=kratos-ui-ratelimit"
    depends_on:
      - kratos

  keto-migrate:
    image: oryd/keto:v0.14.0
    restart: on-failure
    env_file: .env
    environment:
      - DSN=${KETO_DSN}
    command: migrate up -c /etc/config/keto/keto.yml --yes
    volumes:
      - ./ory/config:/etc/config/keto:ro
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v0.14.0
    restart: always
    expose:
      - "4466"
      - "4467"
    env_file: .env
    environment:
      - DSN=${KETO_DSN}
    command: serve -c /etc/config/keto/keto.yml
    volumes:
      - ./ory/config:/etc/config/keto:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully

  # Vault Agent sidecar for oathkeeper
  vault-agent-oathkeeper:
    image: hashicorp/vault:1.21.0
    restart: always
    command: ["agent", "-config=/config/template.hcl"]
    env_file: .env
    environment:
      - PKI_ROLE=oathkeeper-role
      - COMMON_NAME=oathkeeper.service.local
    volumes:
      - ./vault/agent:/config:ro
      - oathkeeper-secrets:/secrets
    entrypoint: >
      sh -c "
      echo \"$$OATHKEEPER_ROLE_ID\" > /vault/role-id &&
      echo \"$$OATHKEEPER_SECRET_ID\" > /vault/secret-id &&
      exec vault agent -config=/config/template.hcl
      "
    depends_on:
      vault:
        condition: service_started

  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    hostname: oathkeeper.service.local
    restart: always
    expose:
      - "4455"
      - "4456"
    env_file: .env
    command: serve -c /etc/config/oathkeeper/oathkeeper.yml
    volumes:
      - ./ory/config:/etc/config/oathkeeper:ro
      - oathkeeper-secrets:/secrets:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oathkeeper.rule=Host(`app.${DOMAIN}`) || Host(`graphql.${DOMAIN}`)"
      - "traefik.http.routers.oathkeeper.entrypoints=websecure"
      - "traefik.http.routers.oathkeeper.tls.certresolver=letsencrypt"
      - "traefik.http.routers.oathkeeper.priority=50"
      - "traefik.http.services.oathkeeper.loadbalancer.server.port=4455"
      - "traefik.http.middlewares.oathkeeper-ratelimit.ratelimit.average=1000"
      - "traefik.http.middlewares.oathkeeper-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.oathkeeper-ratelimit.ratelimit.burst=100"
      - "traefik.http.routers.oathkeeper.middlewares=oathkeeper-ratelimit"
    depends_on:
      vault-agent-oathkeeper:
        condition: service_started
      kratos:
        condition: service_started
      keto:
        condition: service_started
      gateway:
        condition: service_started
      ui:
        condition: service_started
      data:
        condition: service_started

  atlas:
    image: arigaio/atlas:latest
    profiles:
      - tools
    volumes:
      - ./postgres:/app
    working_dir: /app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  vault_data:
  traefik_letsencrypt:

  # Persistent volumes for mTLS certificates (survive container restarts)
  # Vault agent will regenerate certificates if needed
  gateway-secrets:
  data-secrets:
  system-secrets:
  worker-secrets:
  oathkeeper-secrets:
  kratos-secrets:
  temporal-secrets:
