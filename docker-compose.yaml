# Docker Compose configuration for Development
# Usage: docker compose up

services:
  traefik:
    image: traefik:v3.5
    restart: always
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8888:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/kratos/init-kratos-db.sh:/docker-entrypoint-initdb.d/init-kratos-db.sh
    env_file: .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  atlas:
    image: arigaio/atlas:latest
    volumes:
      - ./db:/work
    working_dir: /work
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault:
    image: hashicorp/vault:1.21.0
    restart: always
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command:
      - server
      - -dev
      - -dev-root-token-id=root
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:8200/v1/sys/health?standbyok=true",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: always
    ports:
      - "7233:7233"
    env_file: .env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    restart: always
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      temporal:
        condition: service_healthy

  data:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.data.dev
    restart: always
    ports:
      - "8081:8081"
      - "2345:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - AIR_PROXY_PORT=8081
      - AIR_BUILD_DIR=/app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  gateway:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.gateway.dev
    restart: always
    ports:
      - "8080:8080"
      - "2346:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - AIR_PROXY_PORT=8080
      - AIR_BUILD_DIR=/app/tmp
    depends_on:
      vault:
        condition: service_healthy

  system:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.system.dev
    restart: always
    ports:
      - "8082:8082"
      - "2347:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - AIR_PROXY_PORT=8082
      - AIR_BUILD_DIR=/app/tmp
      - KRATOS_WEBHOOK_SECRET=${KRATOS_WEBHOOK_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker.dev
    restart: always
    ports:
      - "2348:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - AIR_BUILD_DIR=/app/tmp
    depends_on:
      temporal:
        condition: service_started
      vault:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "5173:5173" # Vite HMR
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: .env
    environment:
      - VITE_API_URL=http://api.nexus.local
      - VITE_AUTH_URL=http://auth.nexus.local

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    env_file: .env
    environment:
      - DSN=${DSN}
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    ports:
      - "4433:4433"
      - "4434:4434" # Admin API
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    env_file: .env
    environment:
      - DSN=${DSN}
      - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET}
      - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET}
      - SERVE_PUBLIC_CORS_ENABLED=true
      - SERVE_PUBLIC_CORS_ALLOWED_ORIGINS=http://nexus.local
      - KRATOS_WEBHOOK_SECRET=${KRATOS_WEBHOOK_SECRET}
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier --dev
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4433/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kratos-ui:
    image: oryd/kratos-selfservice-ui-node:v1.3.1
    restart: always
    env_file: .env
    environment:
      - KRATOS_PUBLIC_URL=http://auth.nexus.local
      - KRATOS_BROWSER_URL=http://auth.nexus.local
      - PORT=4455
      - SECURITY_MODE=cookie
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_COOKIE_SECRET=${CSRF_COOKIE_SECRET}
    depends_on:
      kratos:
        condition: service_healthy

  keto-migrate:
    image: oryd/keto:v0.14.0
    volumes:
      - ./infra/keto:/etc/config/keto:ro
    env_file: .env
    environment:
      - DSN=${KETO_DSN}
    command: migrate up --config /etc/config/keto/keto.yml -y
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v0.14.0
    restart: always
    ports:
      - "4466:4466"
      - "4467:4467"
    volumes:
      - ./infra/keto:/etc/config/keto:ro
    env_file: .env
    environment:
      - DSN=${KETO_DSN}
    command: serve --config /etc/config/keto/keto.yml
    depends_on:
      keto-migrate:
        condition: service_completed_successfully

  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    restart: always
    ports:
      - "4455:4455"
      - "4456:4456" # Admin API
    volumes:
      - ./infra/oathkeeper:/etc/config/oathkeeper:ro
    command: serve --config /etc/config/oathkeeper/oathkeeper.yml
    environment:
      - LOG_LEVEL=debug
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oathkeeper.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.nexus.local`)"
      - "traefik.http.routers.oathkeeper.entrypoints=web"
      - "traefik.http.routers.oathkeeper.priority=1"
      - "traefik.http.services.oathkeeper.loadbalancer.server.port=4455"
    depends_on:
      kratos:
        condition: service_started

  adminer:
    image: adminer:latest
    restart: always
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      - HTTP_USER=
      - HTTP_PASSWORD=
    depends_on:
      redis:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      - MH_AUTH_FILE=

volumes:
  postgres_data:
  redis_data:
