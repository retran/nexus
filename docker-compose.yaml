# Docker Compose configuration for Development
# Usage: docker compose up

services:
  traefik:
    image: traefik:v3.5
    restart: always
    ports:
      - "80:80"
      - "8888:8080" # Dashboard (direct access for development)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.dev.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic/middlewares.dev.yml:/etc/traefik/dynamic/middlewares.yml:ro
    labels:
      - "traefik.enable=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/kratos/init-kratos-db.sh:/docker-entrypoint-initdb.d/init-kratos-db.sh
    env_file: .env
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nexus_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  atlas:
    image: arigaio/atlas:latest
    volumes:
      - ./db:/work
    working_dir: /work
    environment:
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/nexus_db?sslmode=disable
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault:
    image: hashicorp/vault:1.21.0
    restart: always
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    command:
      - server
      - -dev
      - -dev-root-token-id=root
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: always
    ports:
      - "7233:7233"
    env_file: .env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:latest
    restart: always
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://nexus.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.temporal-ui.rule=Host(`temporal.nexus.local`)"
      - "traefik.http.routers.temporal-ui.entrypoints=web"
      - "traefik.http.services.temporal-ui.loadbalancer.server.port=8080"
      - "traefik.http.routers.temporal-ui.middlewares=oathkeeper-auth@file"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3

  data:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.data.dev
    restart: always
    ports:
      - "8081:8081"
      - "2345:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      # Vault configuration (dev only)
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      # Air hot-reload configuration
      - AIR_PROXY_PORT=8081
      - AIR_BUILD_DIR=/app/tmp
      # PostgreSQL connection
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nexus_db
      - POSTGRES_SSLMODE=disable
      - POSTGRES_MAX_CONNS=25
      - POSTGRES_MIN_CONNS=5
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.gateway.dev
    restart: always
    ports:
      - "8080:8080"
      - "2346:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      # Vault configuration (dev only)
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      # Air hot-reload configuration
      - AIR_PROXY_PORT=8080
      - AIR_BUILD_DIR=/app/tmp
      # Data API endpoint
      - DATA_API_ENDPOINT=http://data:8081/graphql
      # System API endpoint
      - SYSTEM_API_ENDPOINT=http://system:8082
      # Frontend URL
      - FRONTEND_URL=http://nexus.local
      # Kratos Admin URL
      - KRATOS_ADMIN_URL=http://kratos:4434
      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      # Gateway CORS configuration
      - ALLOWED_ORIGINS=http://nexus.local,https://nexus.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.nexus.local`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
      - "traefik.http.routers.gateway.middlewares=oathkeeper-auth@file"
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  system:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.system.dev
    restart: always
    ports:
      - "8082:8082"
      - "2347:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      # Vault configuration (dev only)
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      # Air hot-reload configuration
      - SERVER_PORT=8082
      - AIR_PROXY_PORT=8082
      - AIR_BUILD_DIR=/app/tmp
      # Kratos configuration
      - KRATOS_ADMIN_URL=http://kratos:4434
      - KRATOS_WEBHOOK_SECRET=${KRATOS_WEBHOOK_SECRET}
      # Temporal configuration
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=nexus-task-queue
      # PostgreSQL connection
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nexus_db
      - POSTGRES_SSLMODE=disable
      - POSTGRES_MAX_CONNS=25
      - POSTGRES_MIN_CONNS=5
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker.dev
    restart: always
    ports:
      - "2348:2345" # Delve debug port
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/tmp
    env_file: .env
    environment:
      # Vault configuration (dev only)
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      # Air hot-reload configuration
      - AIR_BUILD_DIR=/app/tmp
      # Temporal configuration
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=nexus-task-queue
      # Data API endpoint
      - DATA_API_ENDPOINT=http://data:8081/graphql
    depends_on:
      temporal:
        condition: service_started
      vault:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "5173:3000" # Refine dev server
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`nexus.local`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    env_file: .env
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    environment:
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/kratos_db?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate sql -c /etc/config/kratos/kratos.dev.yml -e --yes
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    ports:
      - "4433:4433"
      - "4434:4434" # Admin API
    volumes:
      - ./infra/kratos:/etc/config/kratos:ro
    env_file: .env
    environment:
      # Database connection (secret)
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/kratos_db?sslmode=disable&max_conns=20&max_idle_conns=4
      # Secrets for encryption and cookies
      - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET}
      - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET}
      # Google OIDC credentials (secrets)
      - SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID=${KRATOS_GOOGLE_CLIENT_ID}
      - SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET=${KRATOS_GOOGLE_CLIENT_SECRET}
      # Webhook secret (secret)
      - SELFSERVICE_FLOWS_LOGIN_AFTER_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=${KRATOS_WEBHOOK_SECRET}
      - SELFSERVICE_FLOWS_LOGIN_AFTER_OIDC_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=${KRATOS_WEBHOOK_SECRET}
      - SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=${KRATOS_WEBHOOK_SECRET}
    command: serve -c /etc/config/kratos/kratos.dev.yml --watch-courier --dev
    labels:
      - "traefik.enable=true"
      # Kratos public API (self-service endpoints)
      - "traefik.http.routers.kratos-api.rule=Host(`auth.nexus.local`) && PathPrefix(`/self-service`)"
      - "traefik.http.routers.kratos-api.entrypoints=web"
      - "traefik.http.services.kratos-api.loadbalancer.server.port=4433"
      - "traefik.http.routers.kratos-api.priority=200"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4433/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kratos-ui:
    image: oryd/kratos-selfservice-ui-node:v1.3.1
    restart: always
    env_file: .env
    environment:
      # Kratos API endpoints for UI
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=http://auth.nexus.local
      # UI server configuration
      - PORT=4455
      - SECURITY_MODE=cookie
      # Secrets for UI cookies and CSRF
      - COOKIE_SECRET=${KRATOS_UI_COOKIE_SECRET}
      - CSRF_COOKIE_NAME=${KRATOS_UI_CSRF_COOKIE_NAME}
      - CSRF_COOKIE_SECRET=${KRATOS_UI_CSRF_COOKIE_SECRET}
    labels:
      - "traefik.enable=true"
      # Kratos UI (login/registration pages) - higher priority to match before Kratos API
      - "traefik.http.routers.kratos-ui.rule=Host(`auth.nexus.local`)"
      - "traefik.http.routers.kratos-ui.entrypoints=web"
      - "traefik.http.services.kratos-ui.loadbalancer.server.port=4455"
      - "traefik.http.routers.kratos-ui.priority=100"
    extra_hosts:
      - "auth.nexus.local:host-gateway"
    depends_on:
      kratos:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4455/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  keto-migrate:
    image: oryd/keto:v0.14.0
    volumes:
      - ./infra/keto:/etc/config/keto:ro
    env_file: .env
    environment:
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/keto_db?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate up --config /etc/config/keto/keto.dev.yml -y
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v0.14.0
    restart: always
    ports:
      - "4466:4466"
      - "4467:4467"
    volumes:
      - ./infra/keto:/etc/config/keto:ro
    env_file: .env
    environment:
      - DSN=postgres://admin:${POSTGRES_PASSWORD}@postgres:5432/keto_db?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve --config /etc/config/keto/keto.dev.yml
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4467/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    restart: always
    ports:
      - "4455:4455"
      - "4456:4456" # Decision API for Traefik ForwardAuth
    volumes:
      - ./infra/oathkeeper:/etc/config/oathkeeper:ro
    command: serve --config /etc/config/oathkeeper/oathkeeper.dev.yml
    env_file: .env
    environment:
      - LOG_LEVEL=debug
    depends_on:
      kratos:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4456/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - "8089:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.nexus.local`)"
      - "traefik.http.routers.adminer.entrypoints=web"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
      - "traefik.http.routers.adminer.middlewares=oathkeeper-auth@file"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(file_get_contents('http://127.0.0.1:8080') ? 0 : 1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    restart: always
    ports:
      - "8087:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD}
      - HTTP_USER=
      - HTTP_PASSWORD=
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-commander.rule=Host(`redis.nexus.local`)"
      - "traefik.http.routers.redis-commander.entrypoints=web"
      - "traefik.http.services.redis-commander.loadbalancer.server.port=8081"
      - "traefik.http.routers.redis-commander.middlewares=oathkeeper-auth@file"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      - MH_AUTH_FILE=
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mail.nexus.local`)"
      - "traefik.http.routers.mailhog.entrypoints=web"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"
      - "traefik.http.routers.mailhog.middlewares=oathkeeper-auth@file"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
