version: '3'

vars:
  NODE_VERSION: '22'
  VITE_VERSION: '^6.0.0'
  # Colors
  GREEN: \033[0;32m
  YELLOW: \033[0;33m
  BLUE: \033[0;34m
  RED: \033[0;31m
  NC: \033[0m

tasks:
  # === Development Commands (run locally with hot reload) ===

  dev:
    desc: 'Run frontend with Vite dev server (hot reload)'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Starting Vite dev server with hot reload...\n"
      - npm run dev

  # === Test Commands (run locally) ===

  test:unit:
    desc: 'Run unit tests with Vitest'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running unit tests with Vitest...\n"
      - npm run test
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Unit tests complete\n"

  test:watch:
    desc: 'Run tests in watch mode'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Starting tests in watch mode...\n"
      - npm run test:watch

  test:coverage:
    desc: 'Run tests with coverage'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running tests with coverage...\n"
      - npm run test:coverage
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Coverage report generated\n"

  test:ui:
    desc: 'Run tests with Vitest UI'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Starting Vitest UI...\n"
      - npm run test:ui

  # === Lint Commands ===

  lint:
    desc: 'Run ESLint'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running ESLint...\n"
      - npm run lint
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Linting complete\n"

  lint:fix:
    desc: 'Run ESLint with auto-fix'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running ESLint with auto-fix...\n"
      - npm run lint:fix
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Auto-fix complete\n"

  # === Type Checking ===

  typecheck:
    desc: 'Run TypeScript type checking'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running TypeScript type checking...\n"
      - npm run typecheck
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Type checking complete\n"

  # === Format ===

  fmt:
    desc: 'Format code with Prettier'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Formatting code with Prettier...\n"
      - npm run format
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Code formatted\n"

  fmt:check:
    desc: 'Check code formatting'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Checking code formatting...\n"
      - npm run format:check
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Format check complete\n"

  # === Dependency Management ===

  deps:install:
    desc: 'Install dependencies with npm'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Installing dependencies with npm...\n"
      - npm ci
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Dependencies installed\n"

  deps:update:
    desc: 'Update dependencies'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Updating dependencies...\n"
      - npm update
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Dependencies updated\n"

  deps:audit:
    desc: 'Audit dependencies for vulnerabilities'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Auditing dependencies...\n"
      - npm audit
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Audit complete\n"

  deps:audit:fix:
    desc: 'Fix dependency vulnerabilities'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Fixing vulnerabilities...\n"
      - npm audit fix
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Vulnerabilities fixed\n"

  # === Cleanup ===

  clean:
    desc: 'Clean build artifacts and dependencies'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Cleaning build artifacts...\n"
      - rm -rf dist/
      - rm -rf node_modules/
      - rm -rf .vite/
      - rm -rf coverage/
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Build artifacts cleaned\n"

  clean:cache:
    desc: 'Clean Vite cache only'
    silent: true
    dir: '{{.ROOT_DIR}}/frontend'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Cleaning Vite cache...\n"
      - rm -rf .vite/
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Cache cleaned\n"

  destroy:
    desc: 'Remove all frontend containers and images'
    silent: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Removing frontend containers...\n"
      - docker compose stop ui 2>/dev/null || true
      - docker compose rm -f ui 2>/dev/null || true
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Removing frontend Docker images...\n"
      - docker rmi nexus/ui:dev 2>/dev/null || true
      - docker rmi nexus/ui:latest 2>/dev/null || true
      - task: clean
      - |
        printf "{{.GREEN}}[OK]{{.NC}} Frontend cleanup complete\n"
