version: "3"

vars:
  GREEN: \033[0;32m
  RED: \033[0;31m
  NC: \033[0m

tasks:
  default:
    cmds:
      - task --list-all

  # DEPENDENCIES
  deps:
    desc: "Download Go module dependencies"
    cmds:
      - go mod download
      - printf "{{.GREEN}}[OK]{{.NC}} Go dependencies downloaded\n"

  tidy:
    desc: "Tidy Go module dependencies"
    cmds:
      - go mod tidy
      - printf "{{.GREEN}}[OK]{{.NC}} Go modules tidied\n"

  # BUILD
  build:
    desc: "Build all backend binaries (api-server, gateway, worker)"
    cmds:
      - task: build:api-server
      - task: build:gateway
      - task: build:worker
      - printf "{{.GREEN}}[OK]{{.NC}} All backend binaries built\n"

  build:api-server:
    desc: "Build API server binary"
    cmds:
      - mkdir -p bin
      - go build -o bin/api-server ./cmd/api-server
      - printf "{{.GREEN}}[OK]{{.NC}} Built bin/api-server\n"

  build:gateway:
    desc: "Build Gateway binary"
    cmds:
      - mkdir -p bin
      - go build -o bin/gateway ./cmd/gateway
      - printf "{{.GREEN}}[OK]{{.NC}} Built bin/gateway\n"

  build:worker:
    desc: "Build Worker binary"
    cmds:
      - mkdir -p bin
      - go build -o bin/worker ./cmd/worker
      - printf "{{.GREEN}}[OK]{{.NC}} Built bin/worker\n"

  generate:
    desc: "Generate all code (database + GraphQL server + GraphQL client)"
    cmds:
      - task: db:generate
      - task: graphql:generate
      - task: graphql:client:generate

  db:generate:
    desc: "Generate Go code from SQL queries using sqlc"
    cmds:
      - |
        if ! command -v sqlc >/dev/null; then
          printf "{{.RED}}[ERROR]{{.NC}} sqlc not installed. Install: brew install sqlc or go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest\n"
          exit 1
        fi
        sqlc generate
        printf "{{.GREEN}}[OK]{{.NC}} Generated database code in internal/repository/postgres/\n"

  graphql:generate:
    desc: "Generate GraphQL server code using gqlgen"
    cmds:
      - |
        if ! command -v gqlgen >/dev/null; then
          printf "{{.RED}}[ERROR]{{.NC}} gqlgen not installed. Install: go install github.com/99designs/gqlgen@latest\n"
          exit 1
        fi
        gqlgen generate
        printf "{{.GREEN}}[OK]{{.NC}} Generated GraphQL server code in internal/api/graphql/\n"

  graphql:client:generate:
    desc: "Generate GraphQL client code using genqlient"
    cmds:
      - |
        go run github.com/Khan/genqlient
        printf "{{.GREEN}}[OK]{{.NC}} Generated GraphQL client code in internal/graphql/\n"

  format:
    desc: "Format backend code"
    cmds:
      - gofmt -w .
      - gofumpt -w .
      - printf "{{.GREEN}}[OK]{{.NC}} Go code formatted\n"

  format:check:
    desc: "Check backend code formatting"
    cmds:
      - |
        if [ -n "$(gofmt -l .)" ]; then
          printf "{{.RED}}[ERROR]{{.NC}} Go files are not formatted with gofmt:\n"
          gofmt -l .
          exit 1
        fi
        if [ -n "$(gofumpt -l .)" ]; then
          printf "{{.RED}}[ERROR]{{.NC}} Go files are not formatted with gofumpt:\n"
          gofumpt -l .
          exit 1
        fi
        printf "{{.GREEN}}[OK]{{.NC}} Go code formatting is correct\n"

  lint:
    desc: "Lint backend code with golangci-lint"
    cmds:
      - |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          printf "{{.RED}}[ERROR]{{.NC}} golangci-lint not installed. Install: brew install golangci-lint\n"
          exit 1
        fi
        golangci-lint run

  lint:fix:
    desc: "Lint and auto-fix backend code with golangci-lint"
    cmds:
      - |
        if ! command -v golangci-lint >/dev/null 2>&1; then
          printf "{{.RED}}[ERROR]{{.NC}} golangci-lint not installed. Install: brew install golangci-lint\n"
          exit 1
        fi
        golangci-lint run --fix

  test:
    desc: "Run backend tests"
    cmds:
      - go test -v ./...

  test:coverage:
    desc: "Run backend tests with coverage"
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - printf "{{.GREEN}}[OK]{{.NC}} Coverage report saved to backend/coverage.html\n"

  vuln:check:
    desc: "Check for vulnerabilities"
    cmds:
      - |
        if ! command -v govulncheck >/dev/null; then
          printf "{{.YELLOW}}[INFO]{{.NC}} govulncheck not installed. Installing...\n"
          go install golang.org/x/vuln/cmd/govulncheck@latest
        fi
        govulncheck ./...

  # SECURITY
  security:
    desc: "Run security checks (gosec + govulncheck)"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running gosec...\n"
        if ! command -v gosec >/dev/null 2>&1; then
          printf "{{.YELLOW}}[INFO]{{.NC}} gosec not installed. Installing...\n"
          go install github.com/securego/gosec/v2/cmd/gosec@latest
        fi
        gosec -no-fail ./... || printf "{{.YELLOW}}[WARN]{{.NC}} gosec found issues\n"
      - task: vuln:check
      - printf "{{.GREEN}}[OK]{{.NC}} Backend security checks complete\n"

  # UTILITIES
  clean:
    desc: "Clean build artifacts and caches"
    cmds:
      - rm -rf bin/ tmp/ coverage.out coverage.html
      - go clean -cache -testcache -modcache
      - printf "{{.GREEN}}[OK]{{.NC}} Backend artifacts cleaned\n"
