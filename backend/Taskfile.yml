version: "3"

vars:
  GREEN: \033[0;32m
  RED: \033[0;31m
  NC: \033[0m

tasks:
  default:
    cmds:
      - task --list-all

  build:
    desc: "Build all backend binaries"
    cmds:
      - go build -o bin/api-server ./cmd/api-server
      - go build -o bin/gateway ./cmd/gateway
      - go build -o bin/worker ./cmd/worker
      - printf "{{.GREEN}}[OK]{{.NC}} Built bin/api-server, bin/gateway, and bin/worker\n"

  generate:
    desc: "Generate all code (database + GraphQL server + GraphQL client)"
    cmds:
      - task: db:generate
      - task: graphql:generate
      - task: graphql:client:generate

  db:generate:
    desc: "Generate Go code from SQL queries using sqlc"
    cmds:
      - |
        if ! command -v sqlc >/dev/null; then
          printf "{{.RED}}[ERROR]{{.NC}} sqlc not installed. Install: brew install sqlc or go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest\n"
          exit 1
        fi
        sqlc generate
        printf "{{.GREEN}}[OK]{{.NC}} Generated database code in internal/repository/postgres/\n"

  graphql:generate:
    desc: "Generate GraphQL server code using gqlgen"
    cmds:
      - |
        if ! command -v gqlgen >/dev/null; then
          printf "{{.RED}}[ERROR]{{.NC}} gqlgen not installed. Install: go install github.com/99designs/gqlgen@latest\n"
          exit 1
        fi
        gqlgen generate
        printf "{{.GREEN}}[OK]{{.NC}} Generated GraphQL server code in internal/api/graphql/\n"

  graphql:client:generate:
    desc: "Generate GraphQL client code using genqlient"
    cmds:
      - |
        go run github.com/Khan/genqlient
        printf "{{.GREEN}}[OK]{{.NC}} Generated GraphQL client code in internal/graphql/\n"

  format:
    desc: "Format backend code"
    cmds:
      - gofmt -w .
      - gofumpt -w .
      - printf "{{.GREEN}}[OK]{{.NC}} Go code formatted\n"

  format:check:
    desc: "Check backend code formatting"
    cmds:
      - |
        if [ -n "$(gofmt -l .)" ]; then
          printf "{{.RED}}[ERROR]{{.NC}} Go files are not formatted with gofmt:\n"
          gofmt -l .
          exit 1
        fi
        if [ -n "$(gofumpt -l .)" ]; then
          printf "{{.RED}}[ERROR]{{.NC}} Go files are not formatted with gofumpt:\n"
          gofumpt -l .
          exit 1
        fi
        printf "{{.GREEN}}[OK]{{.NC}} Go code formatting is correct\n"

  lint:
    desc: "Lint backend code"
    cmds:
      - golangci-lint run

  lint:fix:
    desc: "Lint and auto-fix backend code"
    cmds:
      - golangci-lint run --fix

  test:
    desc: "Run backend tests"
    cmds:
      - go test -v ./...

  test:coverage:
    desc: "Run backend tests with coverage"
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - printf "{{.GREEN}}[OK]{{.NC}} Coverage report saved to backend/coverage.html\n"

  vuln:check:
    desc: "Check for vulnerabilities"
    cmds:
      - |
        if ! command -v govulncheck >/dev/null; then
          printf "{{.YELLOW}}[INFO]{{.NC}} govulncheck not installed. Installing...\n"
          go install golang.org/x/vuln/cmd/govulncheck@latest
        fi
        govulncheck ./...
