schema:
  - graphql/data.graphql

exec:
  filename: internal/api/data/exec.go
  package: data

model:
  filename: internal/api/data/model.go
  package: data

resolver:
  layout: follow-schema
  dir: internal/api/data
  package: data
  filename_template: "{name}.resolvers.go"

autobind:
  - "github.com/retran/nexus/backend/internal/repository"

models:
  UserRole:
    model:
      - github.com/retran/nexus/backend/internal/repository.UserRole
  AuditEventType:
    model:
      - github.com/retran/nexus/backend/internal/repository.AuditEventType
