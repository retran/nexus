services:
  postgres:
    image: postgres:alpine
    restart: always
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    restart: always
    ports:
      - "7233:7233"
      - "8088:8088"
    env_file: .env
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamic_config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.api-server.dev
    restart: always
    expose:
      - "8081" # Internal port exposed by the Go API server
    ports:
      - "2345:2345" # Debugger
    env_file: .env
    environment:
      - SERVER_PORT=8081 # Configure Go server to listen on 8081
      - POSTGRES_HOST=postgres
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.api-server.toml"]
    depends_on:
      - postgres
      - temporal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    restart: always
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - API_URL=http://api-server:8081/graphql # Worker reaches the API server
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.worker.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      api-server:
        condition: service_started

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway.dev
    restart: always
    ports:
      - "8080:8080" # Public gateway port
    env_file: .env
    environment:
      - GRAPHQL_ENDPOINT=http://api-server:8081/graphql
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.gateway.toml"]
    depends_on:
      api-server:
        condition: service_started
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "3000:3000" # TODO: Replace with expose
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - gateway # UI depends on the gateway

  atlas:
    image: arigaio/atlas:latest
    profiles:
      - tools
    volumes:
      - ./postgres:/app
    working_dir: /app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  redis_dev_data:
