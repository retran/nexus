# Docker Compose - DEVELOPMENT ENVIRONMENT
# This configuration is for local development only.
# Production deployment uses separate compose files with:
# - HTTPS/TLS certificates (Let's Encrypt)
# - Actual domains (not .local)
# - Cloudflare Tunnel for external access
# - Production-grade logging and monitoring

services:
  traefik:
    image: traefik:v3.5
    restart: always
    command:
      - "--api.insecure=true" # Dev only! Prod: secure dashboard
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG" # Dev: DEBUG; Prod: INFO or WARN
    ports:
      - "80:80" # HTTP
      - "8090:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.nexus.local`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=web"

  postgres:
    image: postgres:18-alpine
    restart: always
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init-kratos-db.sh:/docker-entrypoint-initdb.d/init-kratos-db.sh
    ports:
      - "5432:5432" # Dev: exposed for local access; Prod: internal only
    env_file: .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # Dev: from .env; Prod: from Vault
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379" # Dev: exposed for local access; Prod: internal only
    volumes:
      - redis_dev_data:/data
    env_file: .env # Dev: from .env; Prod: from Vault
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.21.0
    restart: always
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault_dev_data:/vault/data
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_API_ADDR=http://0.0.0.0:8200
    command:
      - vault
      - server
      - -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD", "vault", "status", "-format=json"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: always
    ports:
      - "7233:7233"
      - "8088:8088"
    env_file: .env
    environment:
      - DB=postgres12 # Use postgres12 or postgres12_pgx for PostgreSQL support
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  data-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.data-api.dev
    restart: always
    expose:
      - "8081"
    ports:
      - "2345:2345" # Debugger
    env_file: .env
    environment:
      - SERVER_PORT=8081
      - POSTGRES_HOST=postgres
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.data-api.toml"]
    # NO Traefik labels - accessed via Oathkeeper only
    depends_on:
      - postgres
      - temporal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    restart: always
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - API_URL=http://data-api:8081/graphql # Worker reaches the API server
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.worker.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      data-api:
        condition: service_started

  webhooks:
    build:
      context: ./backend
      dockerfile: Dockerfile.webhooks.dev
    restart: always
    expose:
      - "8082"
    env_file: .env
    environment:
      - PORT=8082
      - GRAPHQL_ENDPOINT=http://data-api:8081/graphql
      - KRATOS_WEBHOOK_SECRET=${WEBHOOK_SECRET}
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.webhooks.toml"]
    depends_on:
      data-api:
        condition: service_started
    # NO Traefik labels - internal only, not exposed to public

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway.dev
    restart: always
    expose:
      - "8080"
    env_file: .env
    environment:
      - GRAPHQL_ENDPOINT=http://data-api:8081/graphql
      - TEMPORAL_HOST=temporal:7233
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.gateway.toml"]
    # NO Traefik labels - accessed via Oathkeeper only
    depends_on:
      data-api:
        condition: service_started
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    expose:
      - "3000"
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # NO Traefik labels - accessed via Oathkeeper only
    depends_on:
      - gateway

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    restart: on-failure
    env_file: .env
    environment:
      - DSN=${DSN}
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    volumes:
      - ./kratos/dev:/etc/config/kratos:ro
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    expose:
      - "4433" # Public API
      - "4434" # Admin API
    env_file: .env
    environment:
      - DSN=${DSN}
      - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET}
      - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET}
      - SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SELFSERVICE_FLOWS_LOGIN_AFTER_OIDC_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=${WEBHOOK_SECRET}
      - SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE=${WEBHOOK_SECRET}
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier # --dev flag for development only!
    volumes:
      - ./kratos/dev:/etc/config/kratos:ro
    labels:
      - "traefik.enable=true"
      # Route for Kratos API endpoints (self-service flows)
      - "traefik.http.routers.kratos-public.rule=Host(`auth.nexus.local`) && (PathPrefix(`/self-service`) || PathPrefix(`/schemas`) || PathPrefix(`/.well-known`))"
      - "traefik.http.routers.kratos-public.priority=100"
      - "traefik.http.services.kratos-public.loadbalancer.server.port=4433"
      # Stricter rate limiting for auth endpoints: 60 requests per minute per IP
      - "traefik.http.middlewares.kratos-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.kratos-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.kratos-ratelimit.ratelimit.burst=20"
      - "traefik.http.routers.kratos-public.middlewares=kratos-ratelimit"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  kratos-selfservice-ui:
    image: oryd/kratos-selfservice-ui-node:v1.3.1
    restart: always
    expose:
      - "3000"
    env_file: .env
    environment:
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=http://auth.nexus.local
      - SECURITY_MODE=cookie
      - PORT=3000
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_COOKIE_SECRET=${CSRF_COOKIE_SECRET}
    labels:
      - "traefik.enable=true"
      # Route for UI pages (lower priority than API)
      # Provides: login, registration, settings, recovery, verification, account dashboard
      - "traefik.http.routers.kratos-ui.rule=Host(`auth.nexus.local`)"
      - "traefik.http.routers.kratos-ui.priority=1"
      - "traefik.http.routers.kratos-ui.entrypoints=web"
      - "traefik.http.services.kratos-ui.loadbalancer.server.port=3000"
      # Rate limiting for UI: 300 requests per minute per IP
      - "traefik.http.middlewares.kratos-ui-ratelimit.ratelimit.average=300"
      - "traefik.http.middlewares.kratos-ui-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.kratos-ui-ratelimit.ratelimit.burst=50"
      - "traefik.http.routers.kratos-ui.middlewares=kratos-ui-ratelimit"
    depends_on:
      - kratos

  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    restart: always
    expose:
      - "4455" # Proxy port
      - "4456" # API port
    command: serve -c /etc/config/oathkeeper/oathkeeper.yml
    volumes:
      - ./kratos/dev:/etc/config/oathkeeper:ro
    labels:
      - "traefik.enable=true"
      # Route all protected domains through Oathkeeper
      - "traefik.http.routers.oathkeeper.rule=Host(`nexus.local`) || Host(`api.nexus.local`) || Host(`graphql.nexus.local`)"
      - "traefik.http.routers.oathkeeper.entrypoints=web"
      - "traefik.http.routers.oathkeeper.priority=50"
      - "traefik.http.services.oathkeeper.loadbalancer.server.port=4455"
      # Rate limiting: 1000 requests per minute per IP
      - "traefik.http.middlewares.oathkeeper-ratelimit.ratelimit.average=1000"
      - "traefik.http.middlewares.oathkeeper-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.oathkeeper-ratelimit.ratelimit.burst=100"
      - "traefik.http.routers.oathkeeper.middlewares=oathkeeper-ratelimit"
    depends_on:
      - kratos
      - gateway
      - ui
      - data-api

  atlas:
    image: arigaio/atlas:latest
    profiles:
      - tools
    volumes:
      - ./postgres:/app
    working_dir: /app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
  redis_dev_data:
  vault_dev_data:
