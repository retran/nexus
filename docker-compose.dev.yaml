services:
  postgres:
    image: postgres:alpine
    restart: always
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:latest
    restart: always
    ports:
      - "7233:7233"
      - "8088:8088"
    env_file: .env
    environment:
      - DB=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamic_config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  api-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.api-server.dev
    restart: always
    ports:
      - "8000:8000"
      - "2345:2345"
    env_file: .env
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.api-server.toml"]
    depends_on:
      - postgres
      - temporal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    restart: always
    env_file: .env
    volumes:
      - ./backend:/app
    command: ["air", "-c", ".air.worker.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      api-server:
        condition: service_started

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    ports:
      - "3000:3000" # TODO: Будет заменен на expose
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-server # Обновлена зависимость

  atlas:
    image: arigaio/atlas:latest
    profiles:
      - tools
    volumes:
      - ./postgres:/app
    working_dir: /app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
