version: "3"

vars:
  GREEN: \033[0;32m
  RED: \033[0;31m
  YELLOW: \033[0;33m
  BLUE: \033[0;34m
  NC: \033[0m

includes:
  backend:
    taskfile: backend/Taskfile.yml
    dir: backend
  frontend:
    taskfile: frontend/Taskfile.yml
    dir: frontend
  postgres:
    taskfile: postgres/Taskfile.yml
    dir: postgres

silent: true

tasks:
  default:
    desc: "Show all available tasks"
    cmds:
      - task --list-all

  # SETUP & INSTALLATION
  setup:
    desc: "First-time setup: install dependencies, initialize environment"
    cmds:
      - task: env:init
      - task: deps
      - task: tools:check
      - printf "{{.GREEN}}[OK]{{.NC}} Setup complete! Run 'task up' to start services.\n"

  deps:
    desc: "Install all project dependencies"
    cmds:
      - task: backend:deps
      - task: frontend:deps
      - task: postgres:deps
      - printf "{{.GREEN}}[OK]{{.NC}} All dependencies installed\n"

  env:init:
    desc: "Initialize .env file from development template"
    cmds:
      - |
        if [ ! -f .env ]; then
          if [ -f .env.dev.example ]; then
            cp .env.dev.example .env
            printf "{{.GREEN}}[OK]{{.NC}} .env file created from .env.dev.example\n"
            printf "{{.YELLOW}}[NOTE]{{.NC}} Don't forget to update secret values in .env\n"
          else
            echo "POSTGRES_USER=admin
        POSTGRES_PASSWORD=SUPER_SECRET_PASSWORD
        POSTGRES_DB=nexus_db" > .env
            printf "{{.GREEN}}[OK]{{.NC}} .env file created with defaults\n"
          fi
        else
          printf "{{.YELLOW}}[INFO]{{.NC}} .env file already exists\n"
        fi

  # TOOLS MANAGEMENT
  tools:install:
    desc: "Install required host tools (golangci-lint, sqlfluff, pre-commit, etc.)"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Installing development tools...\n"

        # golangci-lint
        if ! command -v golangci-lint >/dev/null 2>&1; then
          printf "Installing golangci-lint...\n"
          brew install golangci-lint || curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
        fi

        # sqlfluff (Python)
        if ! command -v sqlfluff >/dev/null 2>&1; then
          printf "Installing sqlfluff...\n"
          pip install sqlfluff || pip3 install sqlfluff
        fi

        # pre-commit
        if ! command -v pre-commit >/dev/null 2>&1; then
          printf "Installing pre-commit...\n"
          brew install pre-commit || pip install pre-commit
        fi

        # gitleaks
        if ! command -v gitleaks >/dev/null 2>&1; then
          printf "Installing gitleaks...\n"
          brew install gitleaks
        fi

        printf "{{.GREEN}}[OK]{{.NC}} All tools installed\n"

  tools:check:
    desc: "Check if all required tools are installed"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Checking required tools...\n"
        MISSING=""

        command -v go >/dev/null 2>&1 || MISSING="$MISSING go"
        command -v node >/dev/null 2>&1 || MISSING="$MISSING node"
        command -v yarn >/dev/null 2>&1 || MISSING="$MISSING yarn"
        command -v docker >/dev/null 2>&1 || MISSING="$MISSING docker"
        command -v docker-compose >/dev/null 2>&1 || MISSING="$MISSING docker-compose"

        if [ -n "$MISSING" ]; then
          printf "{{.RED}}[ERROR]{{.NC}} Missing required tools:$MISSING\n"
          printf "{{.YELLOW}}[INFO]{{.NC}} Run 'task tools:install' to install optional tools\n"
          exit 1
        fi

        printf "{{.GREEN}}[OK]{{.NC}} All required tools are installed\n"
        printf "{{.YELLOW}}[INFO]{{.NC}} Run 'task tools:install' to install optional development tools\n"

  # DEVELOPMENT ENVIRONMENT
  up:
    desc: "Start all services in development mode"
    cmds:
      - docker-compose -f docker-compose.dev.yaml up -d
      - printf "{{.GREEN}}[OK]{{.NC}} All services are starting...\n"
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Waiting for PostgreSQL to be ready...\n"
        sleep 3
        until docker-compose -f docker-compose.dev.yaml exec -T postgres pg_isready -U ${POSTGRES_USER:-admin} >/dev/null 2>&1; do
          printf "{{.YELLOW}}[WAIT]{{.NC}} PostgreSQL is not ready yet...\n"
          sleep 2
        done
        printf "{{.GREEN}}[OK]{{.NC}} PostgreSQL is ready\n"
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Checking if migrations are needed...\n"
        if docker-compose -f docker-compose.dev.yaml exec -T postgres psql -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-nexus_db} -tAc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public'" | grep -q '^0$'; then
          printf "{{.YELLOW}}[INFO]{{.NC}} Database is empty, applying migrations...\n"
          task postgres:migrate:apply
        else
          printf "{{.GREEN}}[OK]{{.NC}} Database already initialized\n"
        fi

  down:
    desc: "Stop all services"
    cmds:
      - docker-compose -f docker-compose.dev.yaml down
      - printf "{{.GREEN}}[OK]{{.NC}} All services stopped.\n"

  down:clean:
    desc: "Stop all services and remove volumes (clean slate)"
    cmds:
      - |
        printf "{{.YELLOW}}[WARNING]{{.NC}} This will remove all containers, networks, and volumes for this project.\n"
        printf "{{.YELLOW}}[WARNING]{{.NC}} All data will be lost!\n"
        read -p "Are you sure? (yes/no): " CONFIRM
        if [ "$CONFIRM" != "yes" ]; then
          printf "{{.RED}}[CANCELLED]{{.NC}} Operation cancelled.\n"
          exit 1
        fi
      - docker-compose -f docker-compose.dev.yaml down -v --remove-orphans
      - printf "{{.GREEN}}[OK]{{.NC}} All services stopped and volumes removed.\n"

  prune:
    desc: "Remove all stopped containers, unused networks, dangling images, and build cache"
    cmds:
      - |
        printf "{{.YELLOW}}[WARNING]{{.NC}} This will remove:\n"
        printf "  - All stopped containers\n"
        printf "  - All networks not used by at least one container\n"
        printf "  - All dangling images\n"
        printf "  - All dangling build cache\n"
        read -p "Continue? (yes/no): " CONFIRM
        if [ "$CONFIRM" != "yes" ]; then
          printf "{{.RED}}[CANCELLED]{{.NC}} Operation cancelled.\n"
          exit 1
        fi
      - docker system prune -f
      - printf "{{.GREEN}}[OK]{{.NC}} Docker cleanup complete.\n"

  restart:
    desc: "Restart all services"
    cmds:
      - task: down
      - task: up

  ps:
    desc: "List running services"
    cmds:
      - docker-compose -f docker-compose.dev.yaml ps

  logs:
    desc: "View logs from all services (use -- <service> for specific one)"
    cmds:
      - docker-compose -f docker-compose.dev.yaml logs -f {{.CLI_ARGS}}

  # AGGREGATED CODE QUALITY & CHECKS
  format:
    desc: "Format all code (Go, JS/TS, SQL, HCL)"
    cmds:
      - task: frontend:format
      - task: backend:format
      - task: postgres:schema:fmt
      - task: postgres:lint:fix

  format:check:
    desc: "Check all code formatting"
    cmds:
      - task: frontend:format:check
      - task: backend:format:check
      - task: postgres:lint:sql

  lint:
    desc: "Run all linters"
    cmds:
      - task: frontend:lint
      - task: backend:lint
      - task: postgres:lint:schema
      - task: postgres:lint:sql

  lint:fix:
    desc: "Run all linters and auto-fix issues"
    cmds:
      - task: frontend:lint:fix
      - task: backend:lint:fix
      - task: postgres:schema:fmt
      - task: postgres:lint:fix

  test:
    desc: "Run all tests"
    cmds:
      - task: backend:test
      - task: frontend:test

  test:coverage:
    desc: "Run all tests and generate coverage reports"
    cmds:
      - task: backend:test:coverage
      - task: frontend:test:coverage

  check:
    desc: "Run all checks (same as pre-commit hooks)"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running pre-commit checks...\n"
        if ! command -v pre-commit >/dev/null 2>&1; then
          printf "{{.RED}}[ERROR]{{.NC}} pre-commit is not installed\n"
          printf "{{.YELLOW}}[INFO]{{.NC}} Install with: brew install pre-commit\n"
          exit 1
        fi
        pre-commit run --all-files
        printf "{{.GREEN}}[OK]{{.NC}} All checks passed!\n"

  # BUILD
  build:
    desc: "Build all services (api-server, gateway, worker, ui)"
    cmds:
      - task: backend:build
      - task: frontend:build
      - printf "{{.GREEN}}[OK]{{.NC}} All services built\n"

  # SECURITY
  security:
    desc: "Run all security checks (gitleaks, gosec, govulncheck, yarn audit)"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running gitleaks...\n"
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --source . --verbose || printf "{{.YELLOW}}[WARN]{{.NC}} Gitleaks found issues\n"
        else
          printf "{{.YELLOW}}[WARN]{{.NC}} gitleaks not installed, skipping\n"
        fi
      - task: backend:security
      - task: frontend:security
      - printf "{{.GREEN}}[OK]{{.NC}} Security checks complete\n"

  # UTILITIES
  repo:format:
    desc: "Format repository root files (YAML, Markdown)"
    cmds:
      - |
        if command -v prettier >/dev/null 2>&1; then
          prettier --write "*.{yaml,yml,md}"
          printf "{{.GREEN}}[OK]{{.NC}} Root files formatted\n"
        else
          printf "{{.YELLOW}}[WARN]{{.NC}} prettier not installed, skipping\n"
        fi

  clean:
    desc: "Clean all build artifacts and caches"
    cmds:
      - task: backend:clean
      - task: frontend:clean
      - printf "{{.GREEN}}[OK]{{.NC}} All artifacts cleaned\n"
