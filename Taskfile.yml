version: "3"

vars:
  GREEN: \033[0;32m
  YELLOW: \033[0;33m
  BLUE: \033[0;34m
  RED: \033[0;31m
  NC: \033[0m

silent: true

tasks:
  default:
    desc: "Show all available tasks"
    cmds:
      - task --list-all

  # PRODUCTION DEPLOYMENT
  up:
    desc: "Start all services in production mode"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Starting Nexus services...\n"
        docker-compose up -d
        printf "{{.GREEN}}[OK]{{.NC}} All services started\n"

  down:
    desc: "Stop all services"
    cmds:
      - docker-compose down
      - printf "{{.GREEN}}[OK]{{.NC}} All services stopped\n"

  restart:
    desc: "Restart all services"
    cmds:
      - task: down
      - task: up

  ps:
    desc: "List running services"
    cmds:
      - docker-compose ps

  logs:
    desc: "View logs from all services (use -- <service> for specific service)"
    cmds:
      - docker-compose logs -f {{.CLI_ARGS}}

  # BUILD
  build:
    desc: "Build all Docker images"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Building production images...\n"
        docker-compose build
        printf "{{.GREEN}}[OK]{{.NC}} All images built\n"

  build:clean:
    desc: "Build all images from scratch (no cache)"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Building images without cache...\n"
        docker-compose build --no-cache
        printf "{{.GREEN}}[OK]{{.NC}} All images built\n"

  # DATABASE
  db:migrate:
    desc: "Run database migrations using Atlas"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Running database migrations...\n"
        docker-compose --profile tools run --rm atlas
        printf "{{.GREEN}}[OK]{{.NC}} Migrations complete\n"

  # VAULT OPERATIONS
  vault:init:
    desc: "Initialize Vault (first-time setup)"
    cmds:
      - |
        printf "{{.YELLOW}}[WARNING]{{.NC}} This will initialize Vault and generate root token\n"
        printf "{{.YELLOW}}[WARNING]{{.NC}} Save the unseal keys and root token in a secure location!\n"
        read -p "Continue? (yes/no): " CONFIRM
        if [ "$CONFIRM" != "yes" ]; then
          printf "{{.BLUE}}[INFO]{{.NC}} Operation cancelled\n"
          exit 0
        fi
        docker-compose exec vault vault operator init

  vault:unseal:
    desc: "Unseal Vault (required after restart)"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Unsealing Vault...\n"
        printf "{{.YELLOW}}[NOTE]{{.NC}} You will need to enter 3 unseal keys\n"
        docker-compose exec vault vault operator unseal
        docker-compose exec vault vault operator unseal
        docker-compose exec vault vault operator unseal
        printf "{{.GREEN}}[OK]{{.NC}} Vault unsealed\n"

  vault:status:
    desc: "Check Vault status"
    cmds:
      - docker-compose exec vault vault status

  # BACKUP & RESTORE
  backup:db:
    desc: "Backup PostgreSQL database"
    cmds:
      - |
        mkdir -p ./backups
        BACKUP_FILE="backup-$(date +%Y%m%d-%H%M%S).sql.gz"
        printf "{{.BLUE}}[INFO]{{.NC}} Creating database backup: $BACKUP_FILE\n"
        docker-compose exec -T postgres pg_dumpall -U ${POSTGRES_USER:-admin} | gzip > "./backups/$BACKUP_FILE"
        printf "{{.GREEN}}[OK]{{.NC}} Backup saved to ./backups/$BACKUP_FILE\n"

  restore:db:
    desc: "Restore PostgreSQL database from backup (use -- <backup-file>)"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          printf "{{.RED}}[ERROR]{{.NC}} Please specify backup file: task restore:db -- backup-20250101-120000.sql.gz\n"
          exit 1
        fi
        printf "{{.YELLOW}}[WARNING]{{.NC}} This will overwrite the current database!\n"
        read -p "Continue? (yes/no): " CONFIRM
        if [ "$CONFIRM" != "yes" ]; then
          printf "{{.BLUE}}[INFO]{{.NC}} Operation cancelled\n"
          exit 0
        fi
        printf "{{.BLUE}}[INFO]{{.NC}} Restoring database from {{.CLI_ARGS}}...\n"
        gunzip < "./backups/{{.CLI_ARGS}}" | docker-compose exec -T postgres psql -U ${POSTGRES_USER:-admin}
        printf "{{.GREEN}}[OK]{{.NC}} Database restored\n"

  # MAINTENANCE
  prune:
    desc: "Remove unused Docker resources"
    cmds:
      - |
        printf "{{.YELLOW}}[WARNING]{{.NC}} This will remove unused containers, networks, and images\n"
        read -p "Continue? (yes/no): " CONFIRM
        if [ "$CONFIRM" != "yes" ]; then
          printf "{{.BLUE}}[INFO]{{.NC}} Operation cancelled\n"
          exit 0
        fi
        docker system prune -f
        printf "{{.GREEN}}[OK]{{.NC}} Docker cleanup complete\n"

  update:
    desc: "Update all images to latest versions"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Pulling latest images...\n"
        docker-compose pull
        printf "{{.GREEN}}[OK]{{.NC}} All images updated\n"
        printf "{{.YELLOW}}[NOTE]{{.NC}} Run 'task restart' to apply updates\n"

  # HEALTH CHECKS
  health:
    desc: "Check health of all services"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Checking service health...\n\n"
        docker-compose ps

  # SSL/TLS
  ssl:renew:
    desc: "Force renewal of Let's Encrypt certificates"
    cmds:
      - |
        printf "{{.BLUE}}[INFO]{{.NC}} Restarting Traefik to renew certificates...\n"
        docker-compose restart traefik
        printf "{{.GREEN}}[OK]{{.NC}} Certificate renewal triggered\n"
        printf "{{.YELLOW}}[NOTE]{{.NC}} Check logs: task logs -- traefik\n"
