# Base Docker Compose configuration
# Common service definitions for production and development
# Used with overrides: docker-compose.prod.yaml or docker-compose.dev.yaml

services:
  traefik:
    image: traefik:v3.5
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:18-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ory/scripts/init-kratos-db.sh:/docker-entrypoint-initdb.d/init-kratos-db.sh
    env_file: .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  atlas:
    image: arigaio/atlas:latest
    volumes:
      - ./postgres:/work
    working_dir: /work
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file: .env
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vault:
    image: hashicorp/vault:1.21.0
    restart: always
    cap_add:
      - IPC_LOCK
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1:8200/v1/sys/health?standbyok=true",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.29.1
    restart: always
    env_file: .env
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  data:
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  gateway:
    restart: always
    env_file: .env
    depends_on:
      vault:
        condition: service_healthy

  system:
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  worker:
    restart: always
    env_file: .env
    depends_on:
      temporal:
        condition: service_started
      vault:
        condition: service_healthy

  frontend:
    restart: always
    env_file: .env

  kratos-migrate:
    image: oryd/kratos:v1.3.1
    env_file: .env
    environment:
      - DSN=${DSN}
    command: migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.1
    restart: always
    env_file: .env
    environment:
      - DSN=${DSN}
      - SECRETS_COOKIE=${KRATOS_COOKIE_SECRET}
      - SECRETS_CIPHER=${KRATOS_CIPHER_SECRET}
    command: serve --watch-courier
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4433/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keto-migrate:
    image: oryd/keto:v0.14.0
    env_file: .env
    environment:
      - DSN=${KETO_DSN}
    command: migrate up -y
    depends_on:
      postgres:
        condition: service_healthy

  keto:
    image: oryd/keto:v0.14.0
    restart: always
    env_file: .env
    environment:
      - DSN=${KETO_DSN}
    command: serve
    depends_on:
      keto-migrate:
        condition: service_completed_successfully

  oathkeeper:
    image: oryd/oathkeeper:v0.40.9
    restart: always
    command: serve
    depends_on:
      kratos:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
