version: "3"

tasks:
  init:
    desc: "Bootstrap the Vault dev instance (init, unseal, policies, AppRoles)"
    cmds:
      - bash scripts/bootstrap-dev.sh

  init-transit:
    desc: "Enable Vault transit engine and configure JWT signing key"
    cmds:
      - bash scripts/init-transit.sh

  seed-dev-secrets:
    desc: "Seed development secrets into Vault KV from .env"
    cmds:
      - bash scripts/seed-dev-secrets.sh

  init-oidc:
    desc: "Configure Vault OIDC auth using Kratos as provider"
    cmds:
      - bash scripts/init-oidc.sh

  rotate-shared-secrets:
    desc: "Rotate shared KV secrets (graceful AppRole rollout)"
    cmds:
      - bash scripts/rotate-shared-secrets.sh

  rotate-transit-key:
    desc: "Rotate Vault transit signing key"
    cmds:
      - bash scripts/rotate-transit-key.sh

  verify-shared-secrets:
    desc: "Verify required shared secrets exist and are current"
    cmds:
      - bash scripts/verify-shared-secrets.sh
