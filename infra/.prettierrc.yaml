semi: true
singleQuote: true
trailingComma: es5
tabWidth: 2
useTabs: false
printWidth: 80
arrowParens: always
endOfLine: lf
bracketSpacing: true

overrides:
  - files: "*.{yml,yaml}"
    options:
      tabWidth: 2
      singleQuote: false

  - files: "*.json"
    options:
      tabWidth: 2
      useTabs: false

  - files: "*.jsonnet"
    options:
      tabWidth: 2
      useTabs: false
