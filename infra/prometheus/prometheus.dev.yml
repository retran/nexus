# Prometheus Configuration for Nexus Development Environment
# Scrapes metrics from all infrastructure and application services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration (disabled for dev)
alerting:
  alertmanagers: []

# Load rules from files
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          env: "dev"
          service: "prometheus"

  # Traefik reverse proxy metrics
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8080"]
        labels:
          env: "dev"
          service: "traefik"

  # Temporal workflow engine metrics
  - job_name: "temporal"
    static_configs:
      - targets: ["temporal:9090"]
        labels:
          env: "dev"
          service: "temporal"

  # Ory Kratos identity metrics
  - job_name: "kratos"
    static_configs:
      - targets: ["kratos:4434"]
        labels:
          env: "dev"
          service: "kratos"
    metrics_path: "/admin/metrics/prometheus"

  # Ory Keto permissions metrics
  - job_name: "keto"
    static_configs:
      - targets: ["keto:4468"]
        labels:
          env: "dev"
          service: "keto"

  # Ory Oathkeeper auth proxy metrics
  - job_name: "oathkeeper"
    static_configs:
      - targets: ["oathkeeper:9000"]
        labels:
          env: "dev"
          service: "oathkeeper"

  # Container metrics (cAdvisor)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          env: "dev"
          service: "cadvisor"

  # PostgreSQL database metrics
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          env: "dev"
          service: "postgres"

  # Redis cache metrics
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          env: "dev"
          service: "redis"

  # Nexus Data Service (GraphQL API)
  - job_name: "nexus-data"
    static_configs:
      - targets: ["data:9091"]
        labels:
          env: "dev"
          service: "data"
          app: "nexus"

  # Nexus Gateway Service (REST API)
  - job_name: "nexus-gateway"
    static_configs:
      - targets: ["gateway:9091"]
        labels:
          env: "dev"
          service: "gateway"
          app: "nexus"

  # Nexus System Service (Internal API)
  - job_name: "nexus-system"
    static_configs:
      - targets: ["system:9091"]
        labels:
          env: "dev"
          service: "system"
          app: "nexus"

  # Nexus Worker Service (Temporal Worker)
  - job_name: "nexus-worker"
    static_configs:
      - targets: ["worker:9091"]
        labels:
          env: "dev"
          service: "worker"
          app: "nexus"
