# Traefik Static Configuration - DEVELOPMENT
# This file defines core Traefik settings: entrypoints, providers, API, logging

global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true # Allow dashboard access without auth on :8080 (dev only)

ping:
  entryPoint: "web"

entryPoints:
  web:
    address: ":80"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
    network: "nexus_default"

  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG
  format: common

accessLog:
  format: common
