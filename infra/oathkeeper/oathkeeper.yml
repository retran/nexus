# Oathkeeper Configuration - SHARED (Dev + Prod)
# Environment-specific values configured via env vars in docker-compose files

version: v0.40.6

log:
  level: debug
  format: json
  leak_sensitive_values: false

serve:
  proxy:
    cors:
      enabled: true
      allowed_origins:
        - http://nexus.local
        - http://api.nexus.local
        - http://auth.nexus.local
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
        - HEAD
      allowed_headers:
        - Authorization
        - Content-Type
        - Cookie
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
      debug: true

errors:
  fallback:
    - json
  handlers:
    redirect:
      enabled: true
      config:
        to: http://auth.nexus.local/login
        code: 302
        return_to_query_param: return_to
        when:
          - error:
              - unauthorized
              - forbidden
            request:
              header:
                accept:
                  - text/html
    json:
      enabled: true
      config:
        verbose: true

access_rules:
  matching_strategy: regexp
  repositories:
    - file:///etc/config/oathkeeper/access-rules.yml

authenticators:
  anonymous:
    enabled: true
    config:
      subject: guest

  cookie_session:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      extra_from: "@this"
      subject_from: "identity.id"
      only:
        - ory_kratos_session

  noop:
    enabled: true

authorizers:
  allow:
    enabled: true

  deny:
    enabled: true

  remote:
    enabled: true
    config:
      remote: http://keto:4466/relation-tuples/check
      headers:
        Content-Type: application/json

  remote_json:
    enabled: true
    config:
      remote: http://keto:4466/relation-tuples/check
      payload: |
        {
          "namespace": "{{ print .MatchContext.namespace }}",
          "object": "{{ print .MatchContext.object }}",
          "relation": "{{ print .MatchContext.relation }}",
          "subject_id": "{{ print .Subject }}"
        }

mutators:
  noop:
    enabled: true

  header:
    enabled: true
    config:
      headers:
        X-User: "{{ print .Subject }}"
        X-User-Email: "{{ print .Extra.identity.traits.email }}"
        X-User-Role: "{{ print .Extra.identity.traits.role }}"
