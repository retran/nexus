# Oathkeeper Access Rules - Development Environment
# Uses nexus.local for local development

# Kratos Public API - for browser self-service flows (must be BEFORE auth-ui rule)
- id: "public:kratos-api"
  upstream:
    preserve_host: false
    url: "http://kratos:4433"
  match:
    url: "<http|https>://auth.nexus.local/self-service<.*>"
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

# Kratos UI - for login/registration pages
- id: "public:auth-ui"
  upstream:
    preserve_host: true
    url: "http://kratos-ui:4455"
  match:
    url: "<http|https>://auth.nexus.local<(?!/self-service).*>"
    methods:
      - GET
      - POST
      - HEAD
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop

- id: "protected:api:admin"
  upstream:
    preserve_host: false
    url: "http://gateway:8080"
  match:
    url: "<http|https>://api.nexus.local/api/admin<.*>"
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      remote: "http://keto:4466/relation-tuples/check"
      payload: |
        {
          "namespace": "Role",
          "object": "admin",
          "relation": "members",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  errors:
    - handler: redirect
      config:
        to: http://auth.nexus.local/login

