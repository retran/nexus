# Oathkeeper Access Rules - DEVELOPMENT Environment
# Uses nexus.local for local development

# API Gateway - Admin endpoints require admin role
- id: "protected:api:admin"
  match:
    url: "<http|https>://api.nexus.local/api/admin<.*>"
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: remote_json
    config:
      remote: "http://keto:4466/relation-tuples/check"
      payload: |
        {
          "namespace": "Role",
          "object": "admin",
          "relation": "members",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header
  errors:
    - handler: redirect
      config:
        to: http://auth.nexus.local/login
        when:
          - error:
              - unauthorized
              - forbidden
            request:
              header:
                accept:
                  - text/html

# API Gateway - Public API endpoints (authenticated users)
- id: "protected:api"
  match:
    url: "<http|https>://api.nexus.local/api<.*>"
    methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - HEAD
  authenticators:
    - handler: cookie_session
  authorizer:
    handler: allow
  mutators:
    - handler: header
  errors:
    - handler: redirect
      config:
        to: http://auth.nexus.local/login
        when:
          - error:
              - unauthorized
              - forbidden
            request:
              header:
                accept:
                  - text/html

# Frontend - Temporary anonymous access (TODO: integrate Kratos auth in React app)
- id: "public:frontend"
  match:
    url: "<http|https|ws|wss>://nexus.local<.*>"
    methods:
      - GET
      - POST
      - HEAD
  authenticators:
    - handler: anonymous
  authorizer:
    handler: allow
  mutators:
    - handler: noop
  errors:
    - handler: json

