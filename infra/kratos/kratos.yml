# Kratos Configuration - SHARED (Dev + Prod)
# Environment-specific values configured via env vars in docker-compose files

version: v1.3.0

dsn: ${DSN}

serve:
  public:
    # All public server config set via env vars:
    # - SERVE_PUBLIC_BASE_URL
    # - SERVE_PUBLIC_CORS_ENABLED
    # - SERVE_PUBLIC_CORS_ALLOWED_ORIGINS
    cors:
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Cookie
        - Content-Type
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://localhost:4434

selfservice:
  # URLs overridden by env vars:
  # - SELFSERVICE_DEFAULT_BROWSER_RETURN_URL
  # - SELFSERVICE_ALLOWED_RETURN_URLS
  default_browser_return_url: "http://localhost"
  allowed_return_urls:
    - "http://localhost"

  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: false
        identifier_similarity_check_enabled: true
        min_password_length: 8
    totp:
      config:
        issuer: Nexus
      enabled: true
    lookup_secret:
      enabled: true
    link:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: google
            provider: google
            client_id: "" # Overridden by SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_ID env var
            client_secret: "" # Overridden by SELFSERVICE_METHODS_OIDC_CONFIG_PROVIDERS_0_CLIENT_SECRET env var
            mapper_url: file:///etc/config/kratos/oidc.google.jsonnet
            scope:
              - email
              - profile
            requested_claims:
              id_token:
                email:
                  essential: true
                email_verified:
                  essential: true
                given_name:
                  essential: true
                family_name: null
                hd: null

  flows:
    # All ui_url and URL values overridden by env vars
    error:
      ui_url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_ERROR_UI_URL

    settings:
      ui_url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_SETTINGS_UI_URL
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_RECOVERY_UI_URL
      use: code

    verification:
      enabled: true
      ui_url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_VERIFICATION_UI_URL
      use: code
      # after.default_browser_return_url overridden by SELFSERVICE_FLOWS_VERIFICATION_AFTER_DEFAULT_BROWSER_RETURN_URL

    logout:
      # after.default_browser_return_url overridden by SELFSERVICE_FLOWS_LOGOUT_AFTER_DEFAULT_BROWSER_RETURN_URL
      after: {}

    login:
      ui_url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_LOGIN_UI_URL
      lifespan: 10m
      after:
        # default_browser_return_url overridden by SELFSERVICE_FLOWS_LOGIN_AFTER_DEFAULT_BROWSER_RETURN_URL
        hooks:
          - hook: web_hook
            config:
              url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_LOGIN_AFTER_HOOKS_0_CONFIG_URL
              method: POST
              body: file:///etc/config/kratos/webhook.jsonnet
              auth:
                type: api_key
                config:
                  name: X-Webhook-Secret
                  value: "" # Overridden by SELFSERVICE_FLOWS_LOGIN_AFTER_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE
                  in: header
        oidc:
          hooks:
            - hook: web_hook
              config:
                url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_LOGIN_AFTER_OIDC_HOOKS_0_CONFIG_URL
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: "" # Overridden by SELFSERVICE_FLOWS_LOGIN_AFTER_OIDC_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE
                    in: header

    registration:
      lifespan: 10m
      ui_url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_REGISTRATION_UI_URL
      after:
        password:
          hooks:
            - hook: web_hook
              config:
                url: "http://localhost" # Overridden by SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_URL
                method: POST
                body: file:///etc/config/kratos/webhook.jsonnet
                auth:
                  type: api_key
                  config:
                    name: X-Webhook-Secret
                    value: "" # Overridden by SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE
                    in: header

log:
  # level and leak_sensitive_values overridden by env vars:
  # - LOG_LEVEL
  # - LOG_LEAK_SENSITIVE_VALUES
  format: text

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 8 # For prod use 12+

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  # smtp.connection_uri overridden by COURIER_SMTP_CONNECTION_URI env var
  smtp: {}
