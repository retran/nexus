# Grafana Mimir Configuration
# Single-process monolithic mode for local development

# Run all components in a single process
target: all

# Multi-tenancy (disabled for dev)
multitenancy_enabled: false

# Server configuration
server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

# Common storage configuration
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/blocks

# Ruler storage (must be separate from common storage)
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler# Blocks storage for long-term metrics
blocks_storage:
  backend: filesystem

  tsdb:
    dir: /data/tsdb
    retention_period: 48h

  bucket_store:
    sync_dir: /data/tsdb-sync

# Compactor configuration
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: inmemory

# Distributor configuration (receives metrics from Grafana Agent)
distributor:
  ring:
    kvstore:
      store: inmemory

# Ingester configuration
ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1

# Store gateway configuration
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory

# Limits configuration
limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  compactor_blocks_retention_period: 48h

# Runtime configuration
runtime_config:
  file: ""
