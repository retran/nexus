# Ory Keto Configuration - SHARED (Dev + Prod)
# Environment-specific values configured via env vars in docker-compose files

version: v0.14.0

dsn: ${DSN}

serve:
  read:
    host: 0.0.0.0
    port: 4466
    cors:
      enabled: true
      allowed_origins:
        - https://${DOMAIN}
        - https://api.${DOMAIN}
        - http://oathkeeper:4455
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type
      allow_credentials: true
  write:
    host: 0.0.0.0
    port: 4467
    cors:
      enabled: true
      allowed_origins:
        - https://${DOMAIN}
        - https://api.${DOMAIN}
        - http://oathkeeper:4455
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
      exposed_headers:
        - Content-Type
      allow_credentials: true

namespaces:
  location: file:///etc/config/keto/namespaces.ts

log:
  level: ${LOG_LEVEL:-info}
  format: ${LOG_FORMAT:-json}
